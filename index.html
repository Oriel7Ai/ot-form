//  תובנות שימוש ומשוב (אנונימי, נשמר רק בדפדפן הזה, יוצא רק בייצוא ידני)
//  נאספים: זמן בכל שלב, אילו צ'יפים נבחרו, עריכות וניסוחים לכל שדה, והערות משוב.
//  לא נאסף: שום טקסט מהדוח, שמות או ערכים שהוזנו. הערות המשוב עוברות הסרת פרטים מזהים לפני השמירה.
// =====================================================================
const TELEMETRY = (() => {
  const KEY = 'ot_form_telemetry_v1';
  let step = 0, enteredAt = Date.now();
  const empty = () => ({v: 1, stepDurationsSec: {}, chipSelections: {}, fieldStats: {}, feedbackItems: []});
  function data(){ try { return Object.assign(empty(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch(e){ return empty(); } }
  function save(d){ try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} }
  function flushStep(){
    const now = Date.now(), sec = Math.round((now - enteredAt) / 1000);
    if (sec > 0 && sec < 3600){ const d = data(); const id = STEPS[step].id; d.stepDurationsSec[id] = (d.stepDurationsSec[id] || 0) + sec; save(d); }
    enteredAt = now;
  }
  return {
    stepChange(i){ if (i === step) return; flushStep(); step = i; },
    chip(group, key){ const d = data(), k = group + ':' + key; d.chipSelections[k] = (d.chipSelections[k] || 0) + 1; save(d); },
    field(id, type){ const d = data(); const f = d.fieldStats[id] = d.fieldStats[id] || {dirty: 0, polish: 0, polishUndo: 0}; f[type] = (f[type] || 0) + 1; save(d); },
    // ההערה עוברת את אותה הסרת פרטים מזהים כמו טקסט שנשלח ל-Claude; נשמר רק הטקסט הנקי
    cleanComment(t){ return DEID.toPlain(DEID.deidentify(hideNames(DEID.normalize(t).trim()), {labels: true, dates: true, phones: true, ids: true, emails: true, address: true, cities: true, doctors: true, kupa: true})); },
    feedback(stepIdx, text){
      const c = this.cleanComment(text); if (!c) return '';
      const page = $(STEPS[stepIdx].id), checked = [...page.querySelectorAll('[data-chips] input:checked')].map(i => i.closest('[data-chips]').dataset.chips + ':' + i.value);
      const d = data(); d.feedbackItems.push({date: new Date().toISOString().slice(0, 10), step: STEPS[stepIdx].id, chips: checked, comment: c}); save(d);
      return c;
    },
    data(){ flushStep(); return data(); },
    clear(){ try { localStorage.removeItem(KEY); } catch(e){} enteredAt = Date.now(); },
  };
})();
function openFeedback(i){
  openModal('<h3>משוב על השלב "' + esc(STEPS[i].title) + '"</h3><p class="hint">מה חסר או מה כדאי לשפר כאן? למשל: "חסר צ\'יפ על אחיזת מספריים". ההערה נשמרת רק במחשב הזה, ויוצאת ממנו רק כשמייצאים את קובץ התובנות.</p>' +
    '<label class="lbl" for="fbText">ההערה</label><textarea id="fbText" style="min-height:90px"></textarea>' +
    '<p class="hint">כך היא תישמר (בלי פרטים מזהים):</p><div class="sendprev" id="fbPrev"></div>' +
    '<div class="mrow"><button class="btn primary" data-fb-save="' + i + '">שמירה</button><button class="btn" data-fb-close="1">ביטול</button></div>');
}
function openInsights(){
  const d = TELEMETRY.data(), steps = Object.keys(d.stepDurationsSec).length, fields = Object.keys(d.fieldStats).length;
  openModal('<h3>תובנות שימוש ומשוב</h3><p>כדי לשפר את הטופס, הדפדפן הזה סופר באופן אנונימי כמה זמן עובדים בכל שלב, אילו בחירות משתמשים בהן, ואילו שדות עורכים ידנית או מבטלים בהם את הניסוח של Claude. ' +
    '<b>לא נשמר שום טקסט מהדוחות ושום פרט על מטופלים.</b> שום דבר לא נשלח אוטומטית: הקובץ יוצא רק אם מורידים אותו ושולחים אותו.</p>' +
    '<ul><li>שלבים שנמדדו: ' + steps + '</li><li>שדות עם עריכות או ניסוחים: ' + fields + '</li><li>הערות משוב: ' + d.feedbackItems.length + '</li></ul>' +
    '<div class="mrow"><button class="btn primary" data-ins="dl">הורדת קובץ התובנות</button><button class="btn" data-ins="clear">מחיקת הנתונים</button><button class="btn" data-ins="close">סגירה</button></div>');
}
function insightsAction(a){
  if (a === 'close') return closeModal();
  if (a === 'clear'){ if (confirm('למחוק את כל נתוני השימוש והמשוב מהמחשב הזה?')){ TELEMETRY.clear(); closeModal(); flash('הנתונים נמחקו'); } return; }
  const bundle = {exportedAt: new Date().toISOString().slice(0, 10),
    privacyNotice: 'מדדי שימוש אנונימיים, הערות משוב אחרי הסרת פרטים מזהים, וניסוחים אישיים כלליים. בלי מידע על מטופלים.',
    telemetry: TELEMETRY.data(), userCustomPhrases: loadPhrases()};
  const a2 = document.createElement('a'); a2.href = URL.createObjectURL(new Blob([JSON.stringify(bundle, null, 2)], {type: 'application/json'}));
  a2.download = 'ot-form-insights-' + bundle.exportedAt + '.json'; document.body.appendChild(a2); a2.click();
  setTimeout(() => { URL.revokeObjectURL(a2.href); a2.remove(); }, 1500);
  closeModal(); flash('קובץ התובנות נשמר בתיקיית ההורדות');
}

// ---- נעילה אחרי חוסר פעילות: מסתירה את הטופס (לא מוחקת), כשיש בו תוכן ----
let IDLE_MS = 15 * 60 * 1000, lastActive = Date.now();
function lockScreen(){
  if (!$('lock').hidden || !hasContent()) return;
  stopDict();
  $('lock').hidden = false; document.querySelectorAll('.topwrap, #pages, #modalWrap').forEach(el => el.inert = true);
  $('unlock').focus();
}
function unlockScreen(){
  $('lock').hidden = true; document.querySelectorAll('.topwrap, #pages, #modalWrap').forEach(el => el.inert = false);
  lastActive = Date.now();
}
function idleCheck(){ if (Date.now() - lastActive >= IDLE_MS) lockScreen(); }
function flash(s){ $('msg').textContent = s; clearTimeout(flash.t); flash.t = setTimeout(() => $('msg').textContent = '', 2500); }
// הודעה עם כפתור פעולה (למשל ביטול), שנשארת זמן ארוך יותר
function flashAction(s, label, fn){
  $('msg').textContent = s;
  const b = document.createElement('button'); b.type = 'button'; b.className = 'linkbtn'; b.textContent = label;
  b.addEventListener('click', () => { clearTimeout(flash.t); $('msg').textContent = ''; fn(); });
  $('msg').appendChild(b);
  clearTimeout(flash.t); flash.t = setTimeout(() => $('msg').textContent = '', 10000);
}
function copyText(t, ok){
  const done = () => flash(ok || 'הועתק');
  const fb = () => { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e){ flash('ההעתקה נכשלה'); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fb); else fb();
}

renderForm();
renderOut();
addMics();

  const id = e.target.id || '';
  let m = id.match(/^(beery_[a-z]+)_s$/); if (m) autoPct(m[1]);
  m = id.match(/^(beery_[a-z]+)_p$/); if (m) delete e.target.dataset.auto;

$('calcCopy').addEventListener('click', () => { const t = $('calcRes').textContent; if (t) copyText(t, 'המשפט הועתק'); });

});

$('modal').addEventListener('click', e => { const el = e.target.closest && e.target.closest('[data-c]'); if (el && !el.disabled) cloudAction(el.getAttribute('data-c'), el); });

$('modal').addEventListener('click', e => { const a = e.target.getAttribute && e.target.getAttribute('data-d'); if (a) draftAction(a); });

$('modal').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  const b = $('modal').querySelector('[data-k="unlock"],[data-k="save"],[data-k="acc-save"],[data-d="save"],[data-d="open"],[data-c="save"],[data-p="add"],[data-p="mesave"]'); if (b){ e.preventDefault(); b.click(); }

$('modal').addEventListener('input', e => { if (e.target.id === 'fbText') $('fbPrev').textContent = TELEMETRY.cleanComment(e.target.value); });
$('modal').addEventListener('click', e => {
  const t = e.target; if (!t.getAttribute) return;
  if (t.getAttribute('data-fb-close')) return closeModal();
  const sv = t.getAttribute('data-fb-save'); if (sv !== null){ const c = TELEMETRY.feedback(+sv, $('fbText').value); closeModal(); flash(c ? 'המשוב נשמר. תודה!' : 'לא נכתבה הערה'); }
  const ia = t.getAttribute('data-ins'); if (ia) insightsAction(ia);
});

$('more').addEventListener('click', e => { if (e.target.closest('.more-menu button')) $('more').open = false; });
document.addEventListener('click', e => { if ($('more').open && !$('more').contains(e.target)) $('more').open = false; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('more').open){ $('more').open = false; $('more').querySelector('summary').focus(); } });
keyStatus();

const STYLE_HINTS = {
  inst: 'פרוזה קלינית בסגנון המכון: הקשיים בכל תחום, והחוזקות בסוף הסיכום.',
  icf: 'קישור בין הממצאים להשתתפות ביומיום, והסיכום נפתח בחוזקות. קשרים ש-Claude מסיק בעצמו מסומנים [לבדיקה: ...], וצריך לאשר או למחוק אותם לפני ההעתקה.',
};

$('polishStyle').addEventListener('change', e => { store(STYLE_STORE, e.target.value === 'inst' ? null : e.target.value); styleSync(); });
styleSync();

document.querySelectorAll('[name="imMode"]').forEach(r => r.addEventListener('change', e => { importMode = e.target.value; extractItems = []; $('imReview').innerHTML = ''; }));
$('imReview').addEventListener('click', e => { const a = e.target.getAttribute && e.target.getAttribute('data-rv'); if (a) reviewAction(a); });
$('imExtra').addEventListener('change', importDeid);
// "הסרה" של שם משפחה שזוהה: נכנס לשדה שם המשפחה (או לרשימת ההסרה אם השדה כבר מלא)
$('imInfo').addEventListener('click', e => {
  const w = e.target.getAttribute && e.target.getAttribute('data-sur'); if (!w) return;

});

});

document.addEventListener('input', e => { const c = e.target.closest && e.target.closest('.ctl.filled'); if (c) c.classList.remove('filled'); });
document.addEventListener('change', e => { const c = e.target.closest && e.target.closest('.ctl.filled'); if (c) c.classList.remove('filled'); });
$('copyAll').addEventListener('click', () => reviewGuard(FIELDS) && copyText(FIELDS.map(f => { const v = $('o_' + f[0]).value.trim(); return v ? f[1] + ':\n' + v : ''; }).filter(Boolean).join('\n\n'), 'כל השדות הועתקו'));
$('resetAll').addEventListener('click', resetForm);
$('status').addEventListener('click', e => {
  if (e.target.id === 'undoPolish') undoPolish();
});
window.addEventListener('beforeunload', e => { saveSession(); if (hasContent()){ e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('pagehide', saveSession);
['pointerdown', 'keydown', 'wheel', 'touchstart', 'input'].forEach(ev => document.addEventListener(ev, () => { if ($('lock').hidden) lastActive = Date.now(); }, {passive: true, capture: true}));
setInterval(idleCheck, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) idleCheck(); });
$('unlock').addEventListener('click', unlockScreen);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveSession(); });
if (!restoreSession()) update();
// עבודה בלי אינטרנט (רק כשהאתר מוגש מהרשת, לא כקובץ מקומי)
if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
function onlineState(){ $('offline').hidden = navigator.onLine; }
window.addEventListener('online', onlineState); window.addEventListener('offline', onlineState); onlineState();
