<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- הדף יכול לתקשר רק עם השרת של Claude (api.anthropic.com), ורק בלחיצה על כפתור ואחרי אישור. שום כתובת אחרת לא נגישה ממנו. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src https://api.anthropic.com">
<title>טופס דוח אבחון</title>
<style>
:root{
  --bg:#f5f4f0; --panel:#fff; --ink:#1e2226; --muted:#5d6570; --line:#dbd8d1; --soft:#efede7;
  --accent:#1d6b5a; --accent-ink:#fff; --accent-soft:#dcefe8; --warn:#9a3412; --warn-soft:#fdecdf;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15171a; --panel:#1e2125; --ink:#e6e8eb; --muted:#9ea6b0; --line:#33373d; --soft:#25292e;
    --accent:#3fae95; --accent-ink:#0c1a16; --accent-soft:#1f3d35; --warn:#f0a070; --warn-soft:#3a2418; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0}
.hdr-fields{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.hdr-fields label{font-size:14px;color:var(--muted)}
.wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media (max-width:980px){ .wrap{grid-template-columns:1fr} .out-col{position:static!important;max-height:none!important} }
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.ctl{margin-bottom:12px}
.ctl > .lbl{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row > .ctl{flex:1 1 150px}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
textarea{min-height:60px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:14px;user-select:none}
.chips input{display:none}
.chips label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
table.sc{border-collapse:collapse;width:100%}
table.sc td,table.sc th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:right;font-size:14px;vertical-align:middle}
table.sc th{color:var(--muted);font-weight:600}
table.sc input,table.sc select{padding:4px 6px}
.out-col{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
.outbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
button.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:6px;cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.btn:disabled{opacity:.55;cursor:wait}
.of{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.of .t{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.of .t b{font-size:14px;flex:1}
.of .badge{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.of .badge:empty{display:none}
.of .badge.ai{background:var(--accent-soft);color:var(--accent)}
.of textarea{min-height:44px;background:var(--bg)}
.of button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:3px 10px;border-radius:5px;cursor:pointer}
.of.empty{opacity:.55}
.msg{font-size:13px;color:var(--muted)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.okbox{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.sec{display:none}.sec.on{display:block}
#modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modalWrap[hidden]{display:none}
#modal{background:var(--panel);color:var(--ink);border-radius:12px;padding:18px 20px;max-width:720px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#modal h3{margin:0 0 8px;font-size:17px}
#modal .lbl{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
.mrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.adv{margin-top:14px}.adv summary{cursor:pointer;color:var(--muted);font-size:13px}
.sendprev{white-space:pre-wrap;word-wrap:break-word;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--bg);max-height:50vh;overflow:auto;font-size:14px}
.tok{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 3px;font-weight:600}
#keyBtn.ok{border-color:var(--accent);color:var(--accent)}
@media (max-width:700px){
  header{position:static;padding:10px 12px}
  header h1{font-size:17px}
  .hdr-fields{gap:8px}
  .hdr-fields label{display:flex;flex-direction:column;gap:3px;flex:1 1 140px}
  .hdr-fields input,.hdr-fields select{width:100%!important}
  .wrap{padding:10px;gap:10px}
  .card{padding:12px}
  .tabs{position:sticky;top:0;z-index:4;background:var(--bg);padding:6px 0;margin-bottom:8px}
  .outbar .btn{flex:1 1 45%}
  table.sc td{font-size:13px}
  #modal{padding:14px}
}
input[data-auto="1"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.calcres{margin:6px 0 8px;font-size:15px;min-height:22px}
.ctl.filled{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
#imPreview{white-space:pre-wrap;word-wrap:break-word;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--bg);max-height:380px;overflow:auto;font-size:14px;min-height:60px}
#imPreview .r{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 3px;font-weight:600;cursor:help}
#imPreview .w{cursor:pointer;border-radius:3px}
#imPreview .w:hover{outline:1px dashed var(--muted)}
#imPreview .fl{background:#fff0b3;color:#5a4600}
.chip-s{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 10px;font-size:13px;margin:0 0 6px 6px}
.chip-s.fl{background:#fff0b3;color:#5a4600}
.mic-wrap{position:relative;display:block}
.mic-wrap textarea{padding-left:38px}
.mic-wrap .mic{position:absolute;left:5px;top:5px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mic-wrap .mic svg{width:15px;height:15px}
.mic-wrap .mic:hover{color:var(--accent);border-color:var(--accent)}
.mic-wrap .mic.on{background:#d93025;border-color:#d93025;color:#fff;animation:micp 1.2s ease-in-out infinite}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(217,48,37,.45)}50%{box-shadow:0 0 0 6px rgba(217,48,37,0)}}
</style>
</head>
<body>
<header>
  <h1>טופס דוח אבחון</h1>
  <div class="hdr-fields">
    <label>שם פרטי (נשאר במכשיר, לא נשלח) <input type="text" id="name" style="width:120px"></label>
    <label>שמות נוספים בדוח (אחים וכו') <input type="text" id="names2" style="width:150px" placeholder="מופרדים בפסיק"></label>
    <label>מגדר <select id="gender" style="width:auto"><option value="m">בן</option><option value="f">בת</option></select></label>
    <label>גיל <input type="number" id="ageY" min="0" max="18" style="width:62px" placeholder="שנים"> <input type="number" id="ageM" min="0" max="11" style="width:62px" placeholder="חודשים"></label>
  </div>
</header>

<div class="wrap">
  <div class="form-col">
    <div class="tabs" id="tabs"></div>
    <div id="form"></div>
  </div>
  <div class="out-col">
    <div class="outbar">
      <button class="btn primary" id="polish">ניסוח בעזרת Claude</button>
      <button class="btn" id="keyBtn">הגדרת מפתח API</button>
      <button class="btn" id="copyAll">העתקת הכול</button>
      <button class="btn" id="exportWord">ייצוא ל-Word</button>
      <button class="btn" id="saveDraft">שמירת טיוטה</button>
      <button class="btn" id="openDraft">פתיחת טיוטה</button>
      <input type="file" id="draftFile" accept=".otdraft,.json" hidden>
      <button class="btn" id="resetAll">ניקוי הטופס</button>
      <span class="msg" id="msg"></span>
    </div>
    <div id="status"></div>
    <div id="out"></div>
  </div>
</div>

<div id="modalWrap" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>

<script>
// =====================================================================
//  הגדרות ובנקי ניסוחים. {זכר|נקבה} מוחלף לפי המגדר. [שם] מוחלף בשם רק במחשב.
// =====================================================================

const AYRES_ITEMS = [
  ['prone','שכיבה על הבטן נגד כוח המשיכה (Prone extension)'],

  ['tone','טונוס שרירים'],
  ['cocon','קו-קונטרקציה'],
  ['equil','תגובות שיווי משקל'],

  ['fingnose','אצבע-אף'],
  ['thumb','מגע אגודל באצבעות'],
  ['midline','חציית קו האמצע'],
  ['eyes','תנועות עיניים ומעקב חזותי'],
  ['schilder','הושטת ידיים (Schilder)'],
];
const AYRES_LEVELS = [['','לא נבדק'],['ok','תקין'],['mild','קושי קל'],['sig','קושי משמעותי']];

const SP2_QUADS = [['seek','חיפוש תחושתי'],['avoid','הימנעות תחושתית'],['sens','רגישות תחושתית'],['reg','רישום נמוך']];
const SP2_SECTIONS = [['aud','עיבוד שמיעתי'],['vis','עיבוד ראייתי'],['touch','עיבוד מגע'],['move','עיבוד תנועה'],['body','עיבוד תנוחת גוף'],['oral','עיבוד אוראלי']];
const SP2_LEVELS = [['','—'],['mless','הרבה פחות מאחרים'],['less','פחות מאחרים'],['same','כמו רוב האחרים'],['more','יותר מאחרים'],['mmore','הרבה יותר מאחרים']];

const BEERY = [['vmi','אינטגרציה ויזו-מוטורית'],['vp','תפיסה חזותית ללא מעורבות מוטורית'],['mc','קואורדינציה מוטורית']];
const MAP_IDX = [['found','מדד היסודות'],['coord','מדד הקואורדינציה'],['verbal','המדד המילולי'],['nonverb','המדד הבלתי מילולי'],['complex','מדד המשימות המורכבות'],['total','הציון הכולל']];

const SENS_MOD = [['hear','שמיעה'],['vision','ראייה'],['oral','פה'],['touch','מגע'],['move','תנועה'],['smell','ריח']];

// ---------- מבנה הטופס ----------
// כל פריט: {type, id, label, opts:[[key,label,phrase?]], hint}
const SECTIONS = [
 { id:'s_bg', title:'רקע', cards:[
  { title:'הפניה ואמצעי הערכה', items:[

      ['',''],['ganenet','הגננת','בהפניית הגננת'],['frame','המסגרת החינוכית','בהפניית המסגרת החינוכית'],['teacher','המורה','בהפניית המורה'],
      ['parents','ההורים','ביוזמת ההורים'],['slp','קלינאית התקשורת','בהפניית קלינאית התקשורת'],['devdoc','רופא התפתחותי','בהמלצת רופא התפתחותי'],
      ['neuro','נוירולוג ילדים','בהפניית נוירולוג ילדים'],['physio','פיזיותרפיסט/ית','בהפניית הפיזיותרפיסט/ית']]},
    {type:'chips', id:'reasons', label:'סיבות הפניה', opts:[

      ['lang','שפה ודיבור','קשיי שפה ודיבור'],['play','משחק','קשיים בהתפתחות המשחק'],['sens','ויסות חושי','קשיים בוויסות חושי'],

  { title:'רקע התפתחותי ורפואי', items:[

  ]},
 ]},
 { id:'s_rep', title:'דיווחים', cards:[
  { title:'דיווח ההורים', items:[
    {type:'chips', id:'parGen', opts:[
      ['easy','ילד/ה נוח/ה','{ילד נוח|ילדה נוחה}'],['social','חברותי/ת','{חברותי, נהנה|חברותית, נהנית} בחברת בני גילו'],

      ['screens','מסכים','{מרבה|מרבה} לצפות במסכים'],['frust','תסכול','{מתוסכל|מתוסכלת} ו{מתעצבן|מתעצבנת} מהר כשלא מצליח'],
      ['att','קשב','{מתקשה|מתקשה} להתמיד בפעילות לאורך זמן']]},
    {type:'sensory', id:'pSens', label:'דיווח חושי לפי חוש'},
    {type:'row', items:[

    ]},

    {type:'text', id:'grade', label:'כיתה (לבית ספר)'},

let goalOrder = [];
function val(id){ const el = $(id); return el ? el.value.trim() : ''; }
function chips(id){ const box = document.querySelector('[data-chips="' + id + '"]'); return box ? [...box.querySelectorAll('input:checked')].map(i => i.value) : []; }
function ph(id, key){ return OPT[id] && OPT[id][key] ? OPT[id][key].phrase : ''; }
function phs(id){ return chips(id).map(k => ph(id, k)); }
function G(s){ const f = val('gender') === 'f'; return s.replace(/\{([^|{}]*)\|([^|{}]*)\}/g, (m,a,b) => f ? b : a); }
function joinList(arr){ arr = arr.filter(Boolean); if (arr.length < 2) return arr.join(''); return arr.slice(0,-1).join(', ') + ' ו' + arr[arr.length-1]; }
function sentences(arr){ return arr.filter(Boolean).map(s => s.trim().replace(/[.\s]+$/,'') + '.').join(' '); }
function cap(arr){ return arr.filter(Boolean).join('\n'); }
function ageNum(){ const y = val('ageY'), m = val('ageM'); if (!y) return ''; return y + (m && m !== '0' ? '.' + m : ''); }
function isToddler(){ const y = parseInt(val('ageY'),10); return !isNaN(y) && y < 3; }

// ---- אחוזון מציון תקן (התפלגות נורמלית) ----
const SCALES = [['ss','ציון תקן (ממוצע 100, ס"ת 15)',100,15],['t','ציון T / ציון תקן של BOT-2 (50, 10)',50,10],['bot','ציון סולמי של תת-מבחן BOT-2 (15, 5)',15,5],['scaled','ציון סולמי (10, 3)',10,3],['z','ציון Z (0, 1)',0,1]];
function normCdf(z){
  const t = 1 / (1 + 0.3275911 * Math.abs(z) / Math.SQRT2);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-z * z / 2);
  return z >= 0 ? (1 + y) / 2 : (1 - y) / 2;
}
function pctFromScore(score, mean, sd){
  const p = normCdf((score - mean) / sd) * 100;
  if (p < 1) return Math.max(0.1, Math.round(p * 10) / 10);
  if (p > 99) return Math.min(99.9, Math.round(p * 10) / 10);
  return Math.round(p);
}
function pctText(p){ p = Number(p); return p < 1 ? 'מתחת לאחוזון 1' : p > 99 ? 'מעל אחוזון 99' : 'באחוזון ' + p; }
function autoPct(prefix){
  const s = $(prefix + '_s'), pe = $(prefix + '_p'); if (!s || !pe) return;
  const manual = pe.value !== '' && pe.dataset.auto !== '1';
  if (manual) return;
  if (s.value === ''){ if (pe.dataset.auto === '1'){ pe.value = ''; delete pe.dataset.auto; } return; }
  pe.value = pctFromScore(Number(s.value), 100, 15); pe.dataset.auto = '1';
}
function calcUpdate(){
  const sc = SCALES.find(x => x[0] === val('calcScale')), v = val('calcScore');
  if (!sc || v === ''){ $('calcRes').textContent = ''; return; }
  const p = pctFromScore(Number(v), sc[2], sc[3]);
  const name = val('calcName');
  $('calcRes').textContent = G((name ? 'ב' + name.replace(/^ב/, '') + ' ' : '') + '{קיבל|קיבלה} ציון ' + v + ', ' + pctText(p) + ', ' + pctPhrase(p) + '.');
}
function pctPhrase(p){
  p = Number(p);
  if (p <= 15) return 'מתחת לטווח הנורמה לגילו';
  if (p <= 24) return 'בטווח הנורמה לגילו, בגבול התחתון';
  if (p <= 49) return 'בטווח הנורמה לגילו, מתחת לממוצע';
  if (p <= 75) return 'בטווח הנורמה לגילו';
  if (p <= 91) return 'בטווח הנורמה הגבוה לגילו';
  return 'מעל לטווח הנורמה לגילו';
}
function mapPhrase(p){
  p = Number(p);
  if (p <= 5) return 'בטווח האדום, המעיד על קושי משמעותי';
  if (p <= 25) return 'בטווח הצהוב, המעיד על קושי קל';
  return 'בטווח הירוק, התואם לגילו';
}

function openingSentence(){
  const a = ageNum();
  const noun = isToddler() ? '{פעוט מקסים|פעוטה מקסימה}' : '{ילד מקסים|ילדה מקסימה}';
  const ageTxt = a ? ' {בן|בת} ' + a + (isToddler() ? ' שנים' : '') : '';
  const joint = chips('joint').length ? 'משותף' : 'בריפוי בעיסוק';
  const ref = val('ref') ? ' ' + ph('ref', val('ref')) : '';
  const rs = phs('reasons');
  return G('[שם] ' + noun + ageTxt + '. {הגיע|הגיעה} לאבחון ' + joint + ref + (rs.length ? ' בשל ' + joinList(rs) : '') + '.');
}

const B = {};
B.tools = () => cap(phs('tools'));
B.background = () => {
  const out = [openingSentence()];
  const birth = [];
  if (val('week')){
    let s = '{נולד|נולדה} בשבוע ' + val('week') + ({cs:' בניתוח קיסרי', normal:' בלידה רגילה'}[val('btype')] || '');
    if (val('weight')) s += ', במשקל ' + val('weight') + ' ק"ג';
    s += {complex:', לאחר היריון מורכב', ok:', לאחר היריון תקין'}[val('preg')] || '';
    birth.push(s);
  }
  if (val('miles') === 'delay') birth.push('נצפה עיכוב בהשגת אבני הדרך ההתפתחותיות');
  if (val('miles') === 'ok') birth.push('{השיג|השיגה} אבני דרך התפתחותיות במועד');
  if (val('health') === 'ok') birth.push('{בריא|בריאה} בדרך כלל');
  if (val('hv') === 'ok') birth.push('בדיקות שמיעה וראייה בוצעו ונמצאו תקינות');
  if (val('hv') === 'none') birth.push('עדיין לא בוצעו בדיקות שמיעה וראייה');
  out.push(G(sentences(birth)));
  if (val('bgNote')) out.push(val('bgNote'));
  return out.filter(Boolean).join('\n');
};

B.family = () => {

function nameList(){
  const arr = [val('name')].concat(val('names2').split(/[,\n]+/).map(s => s.trim()));
  return arr.map((n, i) => ({name:n, token: i === 0 ? '[שם]' : '[שם' + (i+1) + ']'})).filter(x => x.name.length >= 2);
}
function showNames(t){ nameList().forEach(x => { t = t.split(x.token).join(x.name); }); return t; }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function hideNames(t){
  nameList().sort((a,b) => b.name.length - a.name.length).forEach(x => {
    const re = new RegExp('(?<![\\u05D0-\\u05EA])([ובלמהשכ]{0,3})' + escRe(x.name) + '(?![\\u05D0-\\u05EA])', 'g');
    t = t.replace(re, (m, p) => p + x.token);
  });
  // ביטחון נוסף: תאריכים, טלפונים, מספרי זהות ומיילים
  t = t.replace(/[\w.+\-]+@[\w\-]+(\.[\w\-]+)+/g, '[מייל]')
       .replace(/(?<!\d)(?:\+972[\-\s]?|0)(?:5\d|7\d|[23489])[\-\s]?\d{3}[\-\s]?\d{4}(?!\d)/g, '[טלפון]')
       .replace(/(?<!\d)\d{8,9}(?!\d)/g, '[מספר מזהה]')
       .replace(/(?<!\d)\d{1,2}[.\/\-]\d{1,2}[.\/\-](?:\d{4}|\d{2})(?!\d|[.\/]\d)/g, '[תאריך]');
  return t;
}

// =====================================================================
//  חיבור ישיר ל-Claude (בלי n8n). המפתח נשמר מוצפן בדפדפן ונפתח עם קוד.
// =====================================================================
const API_URL = 'https://api.anthropic.com/v1/messages';
const KEY_STORE = 'ot_form_api_key_v1';
const MODEL_STORE = 'ot_form_model_v1';
const DEFAULT_MODEL = 'claude-sonnet-5';
let apiKey = null;        // בזיכרון בלבד, נמחק בסגירת הדף
let keyAfter = null;      // פעולה להמשיך אחרי פתיחת המפתח

const b64 = u8 => { let s = ''; u8.forEach(c => s += String.fromCharCode(c)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function store(k, v){ try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; } catch(e){ return false; } }
function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function hasStoredKey(){ return !!load(KEY_STORE); }
function getModel(){ return load(MODEL_STORE) || DEFAULT_MODEL; }

async function deriveAes(code, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function saveKey(key, code){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await deriveAes(code, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, new TextEncoder().encode(key)));
  if (!store(KEY_STORE, JSON.stringify({v:1, salt:b64(salt), iv:b64(iv), ct:b64(ct)}))) throw new Error('הדפדפן לא מאפשר שמירה. המפתח יישאר פתוח רק עד סגירת הדף.');
}
async function unlockKey(code){
  const s = JSON.parse(load(KEY_STORE));
  const k = await deriveAes(code, unb64(s.salt));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(s.iv)}, k, unb64(s.ct));   // נכשל אם הקוד שגוי
  return new TextDecoder().decode(pt);
}

    if (act === 'forget'){
      if (!confirm('למחוק את המפתח השמור מהמחשב הזה? תצטרכי להזין אותו מחדש.')) return;

async function callClaude(system, user){

      'anthropic-dangerous-direct-browser-access':'true'},

  } catch (e){ throw new Error('אין חיבור ל-Claude. בדקי את חיבור האינטרנט.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok){
    const m = (data.error && data.error.message) || '';
    if (res.status === 401) throw new Error('המפתח לא תקין או בוטל (401). פתחי את "הגדרת מפתח" והזיני מפתח חדש.');

async function encryptJson(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await deriveAes(pass, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, new TextEncoder().encode(JSON.stringify(obj))));
  return JSON.stringify({type:'ot-report-draft', v:1, salt:b64(salt), iv:b64(iv), ct:b64(ct)});
}
// שגיאה עם הודעה שאפשר להציג כמו שהיא
function DraftError(m){ const e = new Error(m); e.show = true; return e; }
// מקלדת עברית תקנית: מקש באנגלית -> האות שהוא מקליד בפריסה העברית
const HEB_KEYS = {q:'/', w:"'", e:'ק', r:'ר', t:'א', y:'ט', u:'ו', i:'ן', o:'ם', p:'פ', a:'ש', s:'ד', d:'ג', f:'כ', g:'ע', h:'י', j:'ח', k:'ל', l:'ך', ';':'ף', "'":',', z:'ז', x:'ס', c:'ב', v:'ה', b:'נ', n:'מ', m:'צ', ',':'ת', '.':'ץ', '/':'.'};
const ENG_KEYS = Object.fromEntries(Object.entries(HEB_KEYS).map(([k, v]) => [v, k]));
// טעויות הקלדה נפוצות בסיסמה: רווח בקצה, שפת מקלדת, Caps Lock, אות ראשונה גדולה בטלפון
function passVariants(p){
  const swap = t => [...t].map(c => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()).join('');
  const toHeb = t => [...t].map(c => HEB_KEYS[c] || c).join('');
  const toEng = t => [...t].map(c => ENG_KEYS[c] || c).join('');
  const first = t => t ? swap(t[0]) + t.slice(1) : t;
  const out = [];
  [p, p.trim()].forEach(b => [b, toHeb(b), toEng(b), toHeb(b.toLowerCase()), swap(b), first(b)].forEach(v => { if (v && !out.includes(v)) out.push(v); }));
  return out;
}
async function decryptJson(text, pass){
  let f;
  try { f = JSON.parse(text); } catch(e){ throw DraftError('הקובץ אינו טיוטה של הטופס, או שהוא נשמר רק בחלקו (למשל הורדה שלא הסתיימה). כדאי לנסות עותק אחר של הקובץ.'); }
  if (!f || f.type !== 'ot-report-draft') throw DraftError('הקובץ אינו טיוטה של הטופס.');
  let salt, iv, ct;
  try { salt = unb64(f.salt); iv = unb64(f.iv); ct = unb64(f.ct); } catch(e){ throw DraftError('קובץ הטיוטה פגום (התוכן המוצפן שבור). כדאי לנסות עותק אחר של הקובץ.'); }
  if (salt.length !== 16 || iv.length !== 12 || ct.length < 17) throw DraftError('קובץ הטיוטה פגום (חסר בו מידע). כדאי לנסות עותק אחר של הקובץ.');
  const tries = passVariants(pass);
  for (const v of tries){
    const k = await deriveAes(v, salt);
    let pt; try { pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, k, ct); } catch(e){ continue; }
    const st = JSON.parse(new TextDecoder().decode(pt));
    if (v !== pass) st._passNote = 'הסיסמה התאימה אחרי תיקון של טעות הקלדה';
    return st;
  }
  throw DraftError('הסיסמה לא מתאימה לקובץ. הקובץ עצמו תקין. בדקו את שפת המקלדת, Caps Lock, ומספרים מול אותיות דומות (0 ו-O, 1 ו-l).');
}

    var pats = (list||[]).map(function(t){ return normalize(t).trim(); })

      .sort(function(a,b){ return b.length - a.length; })

  }
  function whole(re, token, cat){
    text = text.replace(re, function(m){ return put(m, token, cat); });
  }

  // 1. שדות עם תווית ("שם: ...")
  if (o.labels){
    var lab = LABELS.slice().sort(function(a,b){ return b.length - a.length; }).map(esc).join('|');
    var reL = new RegExp('(^|\\t| {2,}|\\|)(\\s*(?:' + lab + ')\\s*[:：]\\s*)([^\\t\\n|]*?)(?=\\t| {2,}|\\||\\.\\s|\\n|$)', 'gm');
    text = text.replace(reL, function(m, lead, label, val){

      return lead + label + put(val, '[הוסר]', 'labels');
    });
  }
  // 2. פרטים שהוזנו ידנית
  terms(o.child, '[שם הילד/ה]', 'child');
  terms(o.family, '[שם משפחה]', 'family');
  terms(o.relatives, '[שם בן משפחה]', 'relatives');
  terms(o.places, '[מקום]', 'places');
  terms(o.insts, '[מסגרת/מוסד]', 'insts');
  terms(o.extra, '[הוסר]', 'extra');

  if (o.emails) whole(/[\w.+\-]+@[\w\-]+(\.[\w\-]+)+/g, '[מייל]', 'emails');
  if (o.address) whole(/(?:רחוב|רח'|שדרות|שד')\s+[א-ת"'\- ]{2,25}?\s*\d{1,4}(?:\s*[א-ת](?![א-ת]))?/g, '[כתובת]', 'address');

    text = text.replace(reK, function(m, pfx, core){ return pfx + put(core, '[קופ"ח]', 'kupa'); });
  }
  if (o.cities) terms(CITIES, '[יישוב]', 'cities');
  if (o.phones) whole(/(?<!\d)(?:\+972[\-\s]?|0)(?:5\d|7\d|[23489])[\-\s]?\d{3}[\-\s]?\d{4}(?!\d)/g, '[טלפון]', 'phones');
  if (o.ids) whole(/(?<!\d)\d{8,9}(?!\d)/g, '[מספר מזהה]', 'ids');
  if (o.dates){
    whole(/(?<!\d)\d{1,2}[.\/\-]\d{1,2}[.\/\-](?:\d{4}|\d{2})(?!\d|[.\/]\d)/g, '[תאריך]', 'dates');
    whole(/(?<![\d.])\d{1,2}[.\/]\d{4}(?!\d)/g, '[תאריך]', 'dates');
    whole(new RegExp('(?<!\\d)\\d{1,2}\\s+[בל]?(?:' + MONTHS + ')(?:\\s*,?\\s*\\d{4})?' + NA, 'g'), '[תאריך]', 'dates');

  }
  return { text: text, items: items };
}

// מאתר מקומות חשודים בקטע טקסט (לבדיקה ידנית, לא מוסר אוטומטית)
function findFlags(seg){
  var out = [], m;
  var reI = /(?:גן|גני|בית הספר|בית ספר|בי"ס|ביה"ס|מעון|תלמוד תורה|ת"ת|ישיבת|אולפנת|ממ"ד)\s+["']?([א-ת][א-ת"'\-]*)/g;
  while ((m = reI.exec(seg))){
    var w = m[1];
    if (FLAG_STOP.indexOf(w) < 0){ var s = m.index + m[0].length - w.length; out.push([s, s + w.length]); }
  }
  var reN = /(?<!\d)\d{4,}(?!\d)/g;
  while ((m = reN.exec(seg))) out.push([m.index, m.index + m[0].length]);
  return out;
}

// ---- קריאת docx בלי ספריות: פענוח ה-zip ו-word/document.xml ----
async function inflateRaw(bytes){
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function docxText(buf){
  const b = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = b.length - 22; i >= Math.max(0, b.length - 66000); i--){ if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; } }
  if (eocd < 0) throw new Error('הקובץ אינו קובץ Word תקין (docx)');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder('utf-8');
  for (let n = 0; n < count; n++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const loc = dv.getUint32(p + 42, true);
    const name = dec.decode(b.subarray(p + 46, p + 46 + nlen));
    if (name === 'word/document.xml'){
      const lnl = dv.getUint16(loc + 26, true), lxl = dv.getUint16(loc + 28, true);
      const start = loc + 30 + lnl + lxl;
      const data = b.subarray(start, start + csize);
      const xmlBytes = method === 0 ? data : await inflateRaw(data);
      return xmlToText(dec.decode(xmlBytes));
    }
    p += 46 + nlen + xlen + clen;
  }
  throw new Error('לא נמצא תוכן בקובץ ה-Word');
}
function xmlToText(xml){
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const out = [];
  [...doc.getElementsByTagName('w:p')].forEach(par => {
    let s = '';
    par.querySelectorAll('*').forEach(el => {
      if (el.tagName === 'w:t') s += el.textContent;
      else if (el.tagName === 'w:tab') s += '\t';
      else if (el.tagName === 'w:br') s += '\n';
    });
    out.push(s);
  });
  return out.join('\n').replace(/\n{3,}/g, '\n\n');
}
async function readAnyFile(f){
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (ext === 'docx') return docxText(await f.arrayBuffer());
  if (ext === 'txt'){
    const buf = await f.arrayBuffer();
    try { return new TextDecoder('utf-8', {fatal:true}).decode(buf); } catch(e){ return new TextDecoder('windows-1255').decode(buf); }
  }
  if (ext === 'pdf') throw new Error('קובצי PDF לא נקראים כאן. פתחי את הקובץ, העתיקי את הטקסט והדביקי בתיבה.');
  if (ext === 'doc') throw new Error('קובץ Word ישן (doc). שמרי אותו מחדש כ-docx ונסי שוב.');
  throw new Error('סוג קובץ לא נתמך');
}

const TOKEN_RE = /(\[שם\d*\]|\[תאריך\]|\[טלפון\]|\[מספר מזהה\]|\[מייל\])/;
function renderImportPreview(){
  const r = importRes;
  const parts = r.text.split(/([-])/);
  let html = '', flags = 0;
  parts.forEach(p => {
    if (/^[-]$/.test(p)){
      const it = r.items[p.charCodeAt(1) - 0xE100];
      html += '<span class="r" title="' + esc('מקור: ' + it.orig) + '">' + esc(it.token) + '</span>';
      return;
    }
    p.split(TOKEN_RE).forEach(seg => {
      if (TOKEN_RE.test(seg) && /^\[.*\]$/.test(seg)){ html += '<span class="r">' + esc(seg) + '</span>'; return; }
      const fl = DEID.findFlags(seg); flags += fl.length;
      let last = 0, m; const reW = /[א-ת][א-ת"'\-]*[א-ת]|[א-ת]|\d+/g;
      while ((m = reW.exec(seg))){
        const s = m.index, e = s + m[0].length;
        html += esc(seg.slice(last, s));
        const f = fl.some(x => x[0] < e && x[1] > s);
        html += '<span class="w' + (f ? ' fl' : '') + '" data-w="' + esc(m[0]) + '">' + esc(m[0]) + '</span>';
        last = e;
      }
      html += esc(seg.slice(last));
    });
  });
  $('imPreview').innerHTML = html;
  const removed = r.items.length + (r.text.match(new RegExp(TOKEN_RE.source, 'g')) || []).length;

}

const HEAD_MAP = [
  [/רקע התפתחותי|רקע רפואי|אנמנזה|היריון ולידה/, 'bgNote'],
  [/טיפולים בעבר|אבחונים קודמים|טיפולים קודמים/, 'prevTx'],

];
function isHeading(line){ const t = line.trim(); return t.length > 2 && t.length <= 45 && /[:：]$/.test(t); }
function fillByHeadings(){
  const text = importOutgoing();
  if (!text){ flash('קודם קראי קובץ'); return; }
  const found = {};
  let cur = null;
  text.split('\n').forEach(line => {
    if (isHeading(line)){ const h = HEAD_MAP.find(x => x[0].test(line)); cur = h ? h[1] : null; return; }
    if (cur && line.trim()) (found[cur] = found[cur] || []).push(line.trim());
  });
  let n = 0;
  Object.keys(found).forEach(id => { if (setCtl(id, found[id].join('\n'))) n++; });
  update();
  $('imStatus').innerHTML = n ? '<div class="okbox">מולאו ' + n + ' שדות לפי כותרות הקובץ (מסומנים במסגרת). בדקי אותם בלשוניות רקע ודיווחים.</div>' : '<div class="warnbox">לא נמצאו כותרות מוכרות בקובץ. נסי "שליפה בעזרת Claude".</div>';
}

// ---- כתיבה לשדה בטופס: לא דורסת מה שכבר מולא ----
function setCtl(id, value){
  if (value === undefined || value === null || value === '') return false;
  const box = document.querySelector('[data-chips="' + id + '"]');
  if (box){
    const keys = Array.isArray(value) ? value : [value]; let ch = false;
    keys.forEach(k => { const inp = box.querySelector('input[value="' + CSS.escape(String(k)) + '"]'); if (inp && !inp.checked){ inp.checked = true; ch = true; } });
    if (ch) box.closest('.ctl').classList.add('filled');
    return ch;
  }
  const el = $(id); if (!el) return false;
  if (el.tagName === 'SELECT'){
    if (el.value !== '' || ![...el.options].some(o => o.value === String(value))) return false;
    el.value = String(value);
  } else if (el.tagName === 'TEXTAREA'){
    el.value = el.value.trim() ? el.value.trim() + '\n' + value : String(value);
  } else {
    if (el.value.trim()) return false;
    el.value = String(value);
  }
  (el.closest('.ctl') || el).classList.add('filled');
  return true;
}

const EXTRACT_SECTIONS = ['s_bg', 's_rep'];
const EXTRACT_SKIP = ['tools'];
function extractSchema(){
  const sc = {};
  function walk(it){
    if (it.type === 'row'){ it.items.forEach(walk); return; }
    if (!it.id || EXTRACT_SKIP.includes(it.id)) return;
    if (it.type === 'select') sc[it.id] = {type:'select', label:it.label || '', options:Object.fromEntries(it.opts.filter(o => o[0]).map(o => [o[0], o[1]]))};
    else if (it.type === 'chips') sc[it.id] = {type:'multi', label:it.label || '', options:Object.fromEntries(it.opts.map(o => [o[0], o[1]]))};
    else if (it.type === 'number') sc[it.id] = {type:'number', label:it.label};
    else if (it.type === 'text' || it.type === 'textarea') sc[it.id] = {type:'text', label:it.label};
    else if (it.type === 'sensory') SENS_MOD.forEach(m => {
      sc['ps_' + m[0]] = {type:'select', label:'דיווח חושי - ' + m[1], options:{none:'ללא רגישות', sens:'רגישות', seek:'חיפוש תחושה'}};
      sc['psn_' + m[0]] = {type:'text', label:'פירוט חושי - ' + m[1]};
    });
  }
  SECTIONS.filter(s => EXTRACT_SECTIONS.includes(s.id)).forEach(s => s.cards.forEach(c => c.items.forEach(walk)));
  return sc;
}
const EXTRACT_GUIDE = `אתה עוזר למרפאה בעיסוק במכון להתפתחות הילד בישראל. קיבלת טקסט ממסמכים על ילד שמגיע לאבחון (שאלונים, דוחות קודמים, סיכומי שיחה), ורשימת שדות של טופס.
המשימה: לחלץ מהטקסט את המידע שמתאים לשדות, ולהחזיר JSON.

כללי ברזל:
1. רק מידע שכתוב במפורש בטקסט. אסור להסיק, לנחש או להשלים. אם אין מידע לשדה, אל תכלול אותו.
2. בשדה מסוג select: החזר מפתח אחד מתוך options. בשדה מסוג multi: מערך של מפתחות מתוך options. בשדה number: מספר בלבד.
3. בשדה מסוג text: משפט או כמה משפטים קצרים בעברית, בגוף שלישי ובסגנון קליני. פרטים שאין להם אפשרות מתאימה ב-options נכנסים לשדות ההערות (bgNote, prevTx, famNote, parNote, schNote).
4. תגיות כמו [שם], [שם2], [תאריך], [יישוב], [הוסר] הן פרטים שהוסרו. העתק אותן כמו שהן, ואל תנסה לשחזר אותן.
5. שדה ref הוא הגורם שהפנה לאבחון הנוכחי. reasons הן סיבות ההפניה.
6. מידע על אבחונים וטיפולים קודמים (פיזיותרפיה, קלינאית תקשורת, רופא התפתחותי) נכנס ל-prevTx בתמצית, כולל המלצות שניתנו.

החזר אך ורק אובייקט JSON תקין שהמפתחות שלו הם מזהי השדות, בלי טקסט נוסף.`;

async function extractWithClaude(){
  const text = importOutgoing();
  if (!text){ flash('קודם קראי קובץ'); return; }
  // בדיקת ביטחון: שמות שהוזנו לא אמורים להופיע במה שנשלח
  const leak = nameList().find(x => new RegExp('(?<![\\u05D0-\\u05EA])' + escRe(x.name) + '(?![\\u05D0-\\u05EA])').test(text));
  if (leak){ $('imStatus').innerHTML = '<div class="warnbox">השליפה בוטלה: נמצא שם בטקסט שעמד להישלח.</div>'; return; }
  const MAX = 40000;
  const body = text.length > MAX ? text.slice(0, MAX) : text;
  const user = 'מגדר: ' + (val('gender') === 'f' ? 'בת' : 'בן') + '.\n\nהשדות האפשריים:\n' + JSON.stringify(extractSchema()) + '\n\nהטקסט מהמסמכים:\n' + body;
  if (!apiKey){ openKeyPanel(extractWithClaude); return; }
  if (!(await confirmSend('שליפה בעזרת Claude', user.split('\n')[0] + '\n\n' + body))) return;
  const btn = $('imExtract'); btn.disabled = true; btn.textContent = 'שולף... (עד דקה)';
  try {
    const obj = parseJsonReply(await callClaude(EXTRACT_GUIDE, user));
    const sc = extractSchema();
    let n = 0;
    Object.keys(obj).forEach(k => { if (sc[k] && setCtl(k, obj[k])) n++; });
    update();
    $('imStatus').innerHTML = '<div class="okbox">מולאו ' + n + ' שדות (מסומנים במסגרת).' + (text.length > MAX ? ' הטקסט היה ארוך ונשלח רק חלקו הראשון.' : '') + ' בדקי אותם בלשוניות רקע ודיווחים לפני שממשיכים.</div>';
  } catch (err){
    $('imStatus').innerHTML = '<div class="warnbox">השליפה נכשלה: ' + esc(err.message) + ' אפשר להשתמש ב"מילוי לפי כותרות".</div>';
  } finally { btn.disabled = false; btn.textContent = 'שליפה אוטומטית בעזרת Claude'; }
}

// =====================================================================
//  ייצוא לקובץ Word (docx), נבנה כולו בדפדפן
// =====================================================================
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files){
  const enc = new TextEncoder(), chunks = [], cd = []; let off = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
    chunks.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
    cd.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + data.length;
  });
  const cdSize = cd.reduce((a, c) => a + c.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  return new Blob(chunks.concat(cd, [new Uint8Array(e.buffer)]), {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
function xe(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function wRuns(text, o){
  // מפצלים קטעים בלועזית מהעברית כדי ששניהם יוצגו בכיוון הנכון
  return text.split(/([A-Za-z][A-Za-z0-9\-\/(). ]*[A-Za-z0-9)])/).filter(s => s !== '').map((s, i, arr) => {
    const latin = /^[A-Za-z]/.test(s);
    return '<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>' + (o.bold ? '<w:b/><w:bCs/>' : '') +
      '<w:sz w:val="' + o.sz + '"/><w:szCs w:val="' + o.sz + '"/>' + (latin ? '' : '<w:rtl/>') + '<w:lang w:bidi="he-IL"/></w:rPr><w:t xml:space="preserve">' + xe(s) + '</w:t></w:r>';
  }).join('');
}
function wPara(text, o){
  o = Object.assign({sz:24, bold:false, after:80, center:false, keep:false}, o || {});
  return '<w:p><w:pPr>' + (o.keep ? '<w:keepNext/>' : '') + '<w:bidi/><w:spacing w:before="' + (o.before || 0) + '" w:after="' + o.after + '" w:line="300" w:lineRule="auto"/>' + (o.center ? '<w:jc w:val="center"/>' : '') + '</w:pPr>' + wRuns(text, o) + '</w:p>';
}
function buildDocx(){
  const parts = [];
  parts.push(wPara('דוח סיכום אבחון - ריפוי בעיסוק', {sz:32, bold:true, center:true, after:120}));
  const meta = [];
  if (val('name')) meta.push('שם: ' + val('name'));
  if (ageNum()) meta.push('גיל: ' + ageNum());
  const d = new Date(); meta.push('תאריך: ' + d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear());
  parts.push(wPara(meta.join('   |   '), {sz:22, center:true, after:240}));
  let n = 0;
  FIELDS.forEach(f => {
    const v = $('o_' + f[0]).value.trim(); if (!v) return; n++;
    parts.push(wPara(f[1], {sz:26, bold:true, before:200, after:80, keep:true}));
    v.split('\n').forEach(line => { if (line.trim()) parts.push(wPara(line.trim(), {sz:24, bold:/^מטרה \d+:$/.test(line.trim())})); });
  });
  const doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + parts.join('') +
    '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="709" w:footer="709" w:gutter="0"/><w:bidi/></w:sectPr></w:body></w:document>';
  const ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  return {blob: zipStore([{name:'[Content_Types].xml', data:ct}, {name:'_rels/.rels', data:rels}, {name:'word/document.xml', data:doc}]), count:n};
}
function exportWord(){
  const r = buildDocx();
  if (!r.count){ flash('אין עדיין תוכן לייצוא'); return; }
  const d = new Date();
  const fname = 'דוח_אבחון_' + (val('name') || 'מטופל') + '_' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + '.docx';
  const a = document.createElement('a'); a.href = URL.createObjectURL(r.blob); a.download = fname;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  flash('הקובץ נשמר בתיקיית ההורדות');
}

// =====================================================================
//  הכתבה קולית (Web Speech API, נתמך ב-Chrome, Edge ו-Safari)
// =====================================================================
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>';
let dict = null;   // {rec, ta, btn, on}
function addMics(root){
  if (!SR) return;
  (root || document).querySelectorAll('#form textarea, #out textarea').forEach(ta => {
    if (ta.parentNode.classList.contains('mic-wrap')) return;
    const w = document.createElement('span'); w.className = 'mic-wrap';
    ta.parentNode.insertBefore(w, ta); w.appendChild(ta);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'mic';
    b.title = 'הכתבה קולית (אמרי "נקודה", "פסיק", "שורה חדשה" לסימני פיסוק)'; b.setAttribute('aria-label', 'הכתבה קולית');
    b.innerHTML = MIC_SVG; w.appendChild(b);
    b.addEventListener('click', () => toggleDict(ta, b));
  });
}
function dictPunct(t){
  return t.replace(/(^|\s)שורה חדשה(?=\s|$)/g, '\n')
          .replace(/(^|\s)(נקודה|פסיק|סימן שאלה|נקודתיים)(?=\s|$)/g, (m, sp, w) => ({'נקודה':'.', 'פסיק':',', 'סימן שאלה':'?', 'נקודתיים':':'})[w])
          .replace(/ *\n */g, '\n');
}
function dictInsert(ta, text){
  text = dictPunct(text.trim()); if (!text) return;
  const a = ta.selectionStart ?? ta.value.length, z = ta.selectionEnd ?? a;
  const before = ta.value.slice(0, a), after = ta.value.slice(z);
  const pre = before && !/[\s]$/.test(before) && !/^[.,?:\n]/.test(text) ? ' ' : '';
  const post = after && !/^\s/.test(after) ? ' ' : '';
  ta.value = before + pre + text + post + after;
  const pos = (before + pre + text).length; ta.setSelectionRange(pos, pos);
  ta.dispatchEvent(new Event('input', {bubbles: true}));
  if (ta.id && ta.id.startsWith('o_')) autoSize(ta);
}
function stopDict(){
  if (!dict) return;
  dict.on = false; dict.btn.classList.remove('on');
  try { dict.rec.stop(); } catch(e){}
  dict = null;
}
function toggleDict(ta, btn){
  const same = dict && dict.ta === ta;
  stopDict(); if (same) return;
  const rec = new SR(); rec.lang = 'he-IL'; rec.interimResults = false; rec.continuous = false;
  const d = dict = {rec, ta, btn, on: true};
  rec.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) dictInsert(ta, e.results[i][0].transcript); };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){ flash('אין הרשאה למיקרופון'); if (dict === d) stopDict(); }
    else if (e.error === 'network'){ flash('ההכתבה דורשת חיבור לאינטרנט'); if (dict === d) stopDict(); }
  };
  // מצב חד-פעמי עם הפעלה מחדש אחרי כל משפט: עקבי יותר בטלפונים מ-continuous
  rec.onend = () => { if (d.on && dict === d){ try { rec.start(); } catch(e){ stopDict(); } } };
  btn.classList.add('on'); ta.focus();
  try { rec.start(); flash('מקשיבה... לחיצה נוספת על המיקרופון עוצרת'); } catch(e){ stopDict(); }
}

}
