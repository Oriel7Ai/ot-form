<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- הדף מתקשר רק עם Claude (דרך ה-Worker המתווך ב-ot-form-proxy.oriel7ai.workers.dev, או ישירות ב-api.anthropic.com) ועם Google (כניסה ושמירה בענן). רכיב הכניסה של Google נטען עם הדף; נתונים נשלחים רק בלחיצה של המשתמשת. שום כתובת אחרת לא נגישה ממנו. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://accounts.google.com; script-src 'unsafe-inline' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com; img-src data: 'self'; connect-src https://ot-form-proxy.oriel7ai.workers.dev https://api.anthropic.com https://www.googleapis.com https://accounts.google.com; manifest-src 'self'; worker-src 'self'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1e5aa8">
<title>טופס דוח אבחון</title>
<style>
:root{
  --bg:#f5f8fc; --panel:#ffffff; --ink:#1b2a3a; --muted:#5a6b7d; --line:#dfe7f0; --soft:#eef3f9;
  --blue:#1e5aa8; --blue-dark:#173f73; --blue-ink:#ffffff; --blue-soft:#e7f0fb;
  --green:#1f8a5b; --green-ink:#0f4d32; --green-soft:#e1f4ea;
  --yellow:#f5c033; --yellow-ink:#2f2400; --yellow-soft:#fff6d9; --yellow-line:#f0d98a;
  --warn:#7a5200;
  --shadow:0 1px 2px rgba(23,63,115,.05), 0 6px 20px rgba(23,63,115,.06);
  --accent:var(--blue); --accent-ink:var(--blue-ink); --accent-soft:var(--blue-soft); --warn-soft:var(--yellow-soft);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1621; --panel:#15202d; --ink:#e5edf6; --muted:#9fb0c3; --line:#263445; --soft:#1b2838;
    --blue:#5b9bf0; --blue-dark:#9cc4ff; --blue-ink:#08121f; --blue-soft:#17304f;
    --green:#43c08a; --green-ink:#a6ecc9; --green-soft:#143528;
    --yellow:#f2c94c; --yellow-ink:#1b1400; --yellow-soft:#3a3115; --yellow-line:#6b5a1f;
    --warn:#f2c94c; --shadow:none;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}

/* ---- סרגל עליון ושלבים ---- */
.topwrap{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line)}
.top{max-width:960px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--blue-dark);font-size:17px}
.brand .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--blue) 0 60%,var(--green) 60% 100%);position:relative}
.brand .mark::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--yellow);top:5px;left:5px}
.cloudinfo{font-size:13px;color:var(--green-ink);background:var(--green-soft);border-radius:999px;padding:2px 10px}
.cloudinfo.dirty{color:var(--warn);background:var(--yellow-soft)}
#who{background:var(--blue-soft);color:var(--blue-dark);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600}
.topactions{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#stepper{max-width:960px;margin:0 auto;padding:0 24px 12px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#stepper::-webkit-scrollbar{display:none}
.st{flex:1 0 auto;display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 8px;cursor:pointer;font:inherit;color:var(--muted);font-size:14px;border-radius:999px;position:relative}
.st .num{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);color:var(--muted);font-weight:700;font-size:13px;flex:none}
.st.done .num{background:var(--green);color:#fff;font-size:0}
.st.done .num::before{content:"✓";font-size:14px}
.st.done{color:var(--green-ink)}
.st.cur{color:var(--blue-dark);font-weight:700;background:var(--blue-soft)}
.st.cur .num{background:var(--blue);color:var(--blue-ink)}
.st:hover:not(.cur){background:var(--soft)}
.st.warn .num{background:var(--yellow);color:var(--yellow-ink);font-size:0}
.st.warn .num::before{content:"!";font-size:14px}

/* ---- דפים ---- */
#pages{max-width:860px;margin:0 auto;padding:36px 24px 96px}
.page{display:none}
.page.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page h2:focus{outline:none}
.page h2{font-size:28px;line-height:1.25;margin:0 0 8px;color:var(--blue-dark)}
.lead{font-size:17px;color:var(--muted);margin:0 0 28px;max-width:640px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 28px;margin-bottom:20px;box-shadow:var(--shadow)}
.card[hidden]{display:none}
.card h3{margin:0 0 16px;font-size:18px;color:var(--blue-dark)}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cardhead h3{margin:0}
.opt{font-size:13px;font-weight:500;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 10px;margin-inline-start:6px;vertical-align:middle}
.ctl{margin-bottom:20px}
.ctl:last-child{margin-bottom:0}
.ctl > .lbl, .lbl{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:16px}
.row > .ctl{flex:1 1 170px}
select,input[type=text],input[type=number],input[type=password],textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;transition:border-color .15s, box-shadow .15s}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea{min-height:84px;resize:vertical}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--soft);border-radius:999px;padding:7px 15px;cursor:pointer;font-size:15px;user-select:none;transition:background .15s}
.chips label:hover{background:var(--blue-soft)}
.chips label:has(input:checked){background:var(--green-soft);border-color:var(--green);color:var(--green-ink);font-weight:600}
.chips label:has(input:checked)::before{content:"✓"}
.chips label[hidden]{display:none}
table.sc{border-collapse:collapse;width:100%}
table.sc td,table.sc th{border-bottom:1px solid var(--line);padding:9px 6px;text-align:right;font-size:15px;vertical-align:middle}
table.sc tr:last-child td{border-bottom:0}
table.sc th{color:var(--muted);font-weight:600;font-size:14px}
table.sc input,table.sc select{padding:7px 10px}

/* ---- כפתורים ---- */
button.btn,summary.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer;transition:background .15s, transform .05s}
button.btn:hover,summary.btn:hover{background:var(--soft)}
button.btn:active{transform:translateY(1px)}
button.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);font-weight:600}
button.btn.primary:hover{filter:brightness(1.07)}
button.btn.cta{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink);font-weight:700;font-size:17px;padding:13px 26px;box-shadow:0 4px 14px rgba(245,192,51,.35)}
button.btn.cta:hover{filter:brightness(1.04)}
button.btn.ghost{background:transparent;border-color:transparent;color:var(--blue-dark)}
button.btn.ghost:hover{background:var(--blue-soft)}
button.btn.small{padding:6px 12px;font-size:14px}
button.btn.normal{background:var(--green-soft);border-color:var(--green);color:var(--green-ink);font-weight:600}
button.btn:disabled{opacity:.55;cursor:wait}
.topactions .btn{padding:6px 12px;font-size:14px}
#keyBtn.ok{border-color:var(--green);color:var(--green-ink);background:var(--green-soft)}
.linkbtn{background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.pagenav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:36px;padding-top:24px;border-top:1px solid var(--line);flex-wrap:wrap}
.nextwrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-inline-start:auto}

/* ---- פתיחה, תצוגה מקדימה, הצעות ובדיקה ---- */
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.preset{text-align:right;font:inherit;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink);transition:border-color .15s, background .15s}
.preset b{color:var(--blue-dark);font-size:16px}
.preset span{color:var(--muted);font-size:14px}
.preset:hover{border-color:var(--blue)}
.preset.on{border-color:var(--blue);background:var(--blue-soft)}
.peek{margin-top:8px;border:1px dashed var(--blue);border-radius:14px;background:var(--panel)}
.peek summary{cursor:pointer;padding:14px 18px;color:var(--blue-dark);font-weight:600;list-style:none}
.peek summary::-webkit-details-marker{display:none}
.peek summary::before{content:"◂ ";color:var(--blue)}
.peek[open] summary::before{content:"▾ "}
.peekbody{padding:0 18px 16px;white-space:pre-wrap;font-size:15px}
.pk{margin-bottom:12px}.pk b{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
.agebar{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--muted);margin-bottom:16px}
.imkind{border:0;padding:0;margin:0 0 16px}
.imkind label{display:block;margin:4px 0;cursor:pointer}
.rvlist{list-style:none;margin:0;padding:0;max-height:60vh;overflow:auto}
.rvlist li{border-bottom:1px solid var(--line);padding:8px 0}
.rvlist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.rvlist input{margin-top:5px;flex:none}
.rvq{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.rvlist li.noq .rvq{color:var(--warn)}
.rvnote{color:var(--muted);font-size:13px}
.fbbtn{font-size:14px;color:var(--muted);white-space:nowrap}
.agecheck:empty{display:none}
.agecheck{background:var(--yellow-soft);border:1px solid var(--yellow-line);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:15px}
.suggbox{background:var(--yellow-soft);border:1px solid var(--yellow-line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.suggbox ul{margin:6px 0 10px;padding-inline-start:20px}
.suggbox li{margin:2px 0}.suggbox li.in{color:var(--green-ink)}
.suggbox .why{color:var(--muted);font-size:14px}
#goalChips label.sugg:not(:has(input:checked)){border:1.5px dashed var(--yellow);background:var(--yellow-soft)}
.checkhead{font-weight:700;margin:0 0 10px}
.checkhead.warn{color:var(--warn)}.checkhead.good{color:var(--green-ink)}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.checklist li:last-child{border-bottom:0}
.checklist .ic{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.checklist li.ok .ic{background:var(--green-soft);color:var(--green-ink)}
.checklist li.no .ic{background:var(--yellow);color:var(--yellow-ink)}
.checklist li > span:nth-child(2){flex:1 1 300px}

/* ---- שדות הדוח ---- */
.of{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--panel)}
.of .t{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.of .t b{font-size:15px;flex:1;color:var(--blue-dark)}
.of .badge{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.of .badge:empty{display:none}
.of .badge.warn{background:var(--yellow-soft);color:var(--warn)}
.of .badge.ai{background:var(--green-soft);color:var(--green-ink)}
.of textarea{min-height:48px;background:var(--bg)}
.of button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--blue-dark);padding:4px 12px;border-radius:8px;cursor:pointer}
.of button:hover{background:var(--blue-soft)}
.of .addtxt{display:none}
/* שדה ריק מוצג מכווץ, עם כפתור להוספת טקסט */
.of.empty:not(.open){padding:10px 16px;border-style:dashed;background:transparent}
.of.empty:not(.open) .t{margin:0}
.of.empty:not(.open) > textarea, .of.empty:not(.open) .mic-wrap, .of.empty [data-copy]{display:none}
.of.empty:not(.open) .addtxt{display:inline-block}
.msg{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--blue-dark);color:var(--panel);padding:10px 18px;border-radius:999px;font-size:15px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.msg:empty{display:none}
.warnbox{background:var(--yellow-soft);color:var(--warn);border:1px solid var(--yellow-line);border-radius:10px;padding:10px 14px;font-size:15px;margin-bottom:10px}
.okbox{background:var(--green-soft);color:var(--green-ink);border-radius:10px;padding:10px 14px;font-size:15px;margin-bottom:10px}

/* ---- חלונות ---- */
#modalWrap{position:fixed;inset:0;background:rgba(14,30,52,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modalWrap[hidden]{display:none}
#modal{background:var(--panel);color:var(--ink);border-radius:16px;padding:24px 26px;max-width:720px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 16px 48px rgba(0,0,0,.25)}
#modal h3{margin:0 0 10px;font-size:19px;color:var(--blue-dark)}
#modal .lbl{margin:14px 0 6px}
.mrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.adv{margin-top:16px}.adv summary{cursor:pointer;color:var(--muted);font-size:13px}
.sendprev{white-space:pre-wrap;word-wrap:break-word;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);max-height:50vh;overflow:auto;font-size:15px}
.tok{background:var(--blue-soft);color:var(--blue-dark);border-radius:4px;padding:0 3px;font-weight:600}

/* ---- ייבוא, אחוזונים, סימונים ---- */
input[data-auto="1"]{background:var(--green-soft);color:var(--green-ink);font-weight:600}
.calcres{margin:8px 0 10px;font-size:16px;min-height:24px;color:var(--blue-dark)}
.ctl.filled{outline:2px solid var(--blue);outline-offset:6px;border-radius:8px}
#imPreview{white-space:pre-wrap;word-wrap:break-word;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);max-height:380px;overflow:auto;font-size:15px;min-height:64px}
#imPreview .r{background:var(--green-soft);color:var(--green-ink);border-radius:4px;padding:0 3px;font-weight:600;cursor:help}
#imPreview .w{cursor:pointer;border-radius:3px}
#imPreview .w:hover{outline:1px dashed var(--muted)}
#imPreview .fl{background:var(--yellow-soft);color:var(--warn);box-shadow:inset 0 -2px 0 var(--yellow)}
.chip-s{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 12px;font-size:13px;margin:0 0 8px 6px}
.chip-s.fl{background:var(--yellow-soft);color:var(--warn)}

@media (max-width:700px){
  body{font-size:16px}
  .top{padding:10px 14px;gap:8px}
  .brand span.t{display:none}
  .topactions{width:100%;margin:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .topactions::-webkit-scrollbar{display:none}
  .topactions .btn{flex:none;padding:5px 11px;font-size:13px}
  .topactions{overflow:visible;flex-wrap:wrap}
  .more-menu{left:0}
  .top{row-gap:6px}
  #stepper{padding:0 10px 10px}
  .st .lbl2{display:none}
  .st.cur .lbl2{display:inline}
  #pages{padding:24px 14px 80px}
  .page h2{font-size:23px}
  .lead{font-size:16px;margin-bottom:20px}
  .card{padding:18px 16px;border-radius:14px}
  .pagenav .btn.cta{width:100%}
  .nextwrap{width:100%}
  table.sc td{font-size:14px}
  #modal{padding:18px}
}

/* ---- נגישות, תפריט "עוד" וניסוחים אישיים ---- */
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.chips label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
.chips label.mine{border:1px dashed var(--line)}
.chips .addph{border:1px dashed var(--line);background:none;color:var(--muted);border-radius:999px;padding:7px 15px;cursor:pointer;font:inherit;font-size:15px}
.chips .addph:hover{color:var(--blue-dark);border-color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.more{position:relative}
.more > summary{list-style:none;cursor:pointer}
.more > summary::-webkit-details-marker{display:none}
.more-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(14,30,52,.18);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:210px}
.more-menu .btn{text-align:right;width:100%;border-color:transparent}
.msg .linkbtn{color:inherit;font-weight:700;margin-inline-start:8px}
.clist{list-style:none;margin:10px 0 0;padding:0;max-height:50vh;overflow:auto}
.mic-wrap{position:relative;display:block}
.mic-wrap textarea{padding-left:38px}
.mic-wrap .mic{position:absolute;left:5px;top:5px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mic-wrap .mic svg{width:15px;height:15px}
.mic-wrap .mic:hover{color:var(--accent);border-color:var(--accent)}
.mic-wrap .mic.on{background:#d93025;border-color:#d93025;color:#fff;animation:micp 1.2s ease-in-out infinite}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(217,48,37,.45)}50%{box-shadow:0 0 0 6px rgba(217,48,37,0)}}
.clist li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 0}
.clist li .cpick{flex:1;text-align:right;background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;padding:6px 4px;border-radius:5px}
.clist li .cpick:hover{background:var(--soft)}
.clist li .cpick small{display:block;color:var(--muted);font-size:12px}
.clist li .cdel{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:5px;padding:3px 9px;cursor:pointer}

/* מי שביקש במערכת "הפחתת תנועה": בלי אנימציות ובלי גלילה חלקה */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* מסך נעילה אחרי חוסר פעילות */
#lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#lock[hidden]{display:none}
#lock .lockbox{max-width:420px;text-align:center}
#lock h2{color:var(--blue-dark);margin:0 0 8px}

/* ---- הדפסה / PDF: רק הדוח עצמו ---- */
#printArea{display:none}
@media print{
  body{background:#fff;color:#000;font:12pt/1.6 Arial,"Noto Sans Hebrew",sans-serif}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea .pinst{text-align:center;font-size:11pt;margin:0}
  #printArea h1{text-align:center;font-size:17pt;margin:4pt 0}
  #printArea .pmeta{text-align:center;font-size:11pt;margin:0 0 14pt}
  #printArea h2{font-size:13pt;margin:12pt 0 4pt;break-after:avoid}
  #printArea p{margin:0 0 4pt;white-space:pre-wrap}
  #printArea .gh{font-weight:700;margin-top:6pt}
  #printArea .psign{margin-top:28pt;break-inside:avoid}
  @page{size:A4;margin:18mm}
}
</style>
</head>
<body>
<div class="topwrap">
  <div class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span class="t">דוח אבחון · ריפוי בעיסוק</span></div>
    <span id="who"></span>
    <span id="cloudInfo" class="cloudinfo" hidden></span>

const OPT = {};   // id -> {key: {label, phrase}}
const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderItem(it){
  if (it.type === 'row') return '<div class="row">' + it.items.map(renderItem).join('') + '</div>';
  // כותרת מקושרת לשדה (for), כדי שקורא מסך יקריא אותה ולחיצה עליה תעביר לשדה
  const field = ['select','text','number','textarea'].includes(it.type);
  const lbl = it.label ? (field ? '<label class="lbl" for="' + it.id + '">' : '<span class="lbl" id="lb_' + it.id + '">') + esc(it.label) + (field ? '</label>' : '</span>') : '';
  const aria = it.label ? '' : ' aria-label="' + esc(cardTitleOf(it.id)) + '"';
  const hint = it.hint ? '<p class="hint">' + esc(it.hint) + '</p>' : '';
  if (it.opts){ OPT[it.id] = {}; it.opts.forEach(o => OPT[it.id][o[0]] = {label:o[1], phrase:o[2] || o[1]}); }
  switch (it.type){
    case 'select':
      return '<div class="ctl">' + lbl + '<select id="' + it.id + '"' + aria + '>' + it.opts.map(optHtml).join('') + '</select>' + hint + '</div>';
    case 'chips':
      return '<div class="ctl">' + lbl + '<div class="chips" role="group" ' + (it.label ? 'aria-labelledby="lb_' + it.id + '"' : aria.trim()) + ' data-chips="' + it.id + '">' + it.opts.map(chipHtml).join('') +
        (NO_CUSTOM.includes(it.id) ? '' : '<button type="button" class="addph" data-addph="' + it.id + '" title="הוספת ניסוח משלי לקבוצה הזו">+ ניסוח משלי</button>') + '</div>' + hint + '</div>';
    case 'text': return '<div class="ctl">' + lbl + '<input type="text" id="' + it.id + '"' + aria + '>' + hint + '</div>';
    case 'number': return '<div class="ctl">' + lbl + '<input type="number" id="' + it.id + '"' + aria + '>' + hint + '</div>';
    case 'textarea': return '<div class="ctl">' + lbl + '<textarea id="' + it.id + '"' + aria + '></textarea>' + hint + '</div>';
    case 'scores':
      return '<div class="ctl">' + lbl + '<table class="sc"><tr><th>מדד</th><th>אחוזון</th>' + (it.noStd ? '' : '<th>ציון תקן</th>') + '</tr>' +
        it.rows.map(r => '<tr><td>' + esc(r[1]) + '</td><td><input type="number" min="0" max="100" id="' + it.id + '_' + r[0] + '_p" aria-label="' + esc(r[1]) + ' - אחוזון"></td>' + (it.noStd ? '' : '<td><input type="number" id="' + it.id + '_' + r[0] + '_s" aria-label="' + esc(r[1]) + ' - ציון תקן"></td>') + '</tr>').join('') +
        '</table><p class="hint">' + (it.noStd ? '' : 'הקלדת ציון תקן ממלאת את האחוזון אוטומטית (ממוצע 100, ס"ת 15). אחוזון מחושב מסומן בצבע. אם יש אחוזון מהמדריך, הקלידי אותו והוא יקבע. ') + 'הניסוח לפי אחוזון נוצר אוטומטית ואפשר לערוך אותו בשדה הפלט.</p></div>';
    case 'ayres':
      return '<div class="ctl">' + lbl + '<table class="sc">' + AYRES_ITEMS.map(r => '<tr><td>' + esc(r[1]) + '</td><td><select id="ay_' + r[0] + '" aria-label="' + esc(r[1]) + '">' + AYRES_LEVELS.map(l => '<option value="' + l[0] + '">' + l[1] + '</option>').join('') + '</select></td></tr>').join('') + '</table></div>';
    case 'sp2':
      return '<div class="ctl">' + lbl + '<table class="sc"><tr><th colspan="2">רביעים</th></tr>' + SP2_QUADS.map(r => spRow('sq_' + r[0], r[1])).join('') +
        '<tr><th colspan="2">תחומי חישה</th></tr>' + SP2_SECTIONS.map(r => spRow('ss_' + r[0], r[1])).join('') +
        '<tr><th colspan="2">תחומים התנהגותיים</th></tr>' + SP2_BEH.map(r => spRow('sb_' + r[0], r[1])).join('') + '</table><p class="hint">לכל רביע שמסומן "יותר" או "פחות" מאחרים, נכתב בדוח גם משפט שמסביר מה זה אומר על הילד/ה.</p></div>';
    case 'sensory':
      return '<div class="ctl">' + lbl + '<table class="sc">' + SENS_MOD.map(r => '<tr><td style="width:70px">' + r[1] + '</td><td><select id="ps_' + r[0] + '" aria-label="' + r[1] + '"><option value="">— לא נבחר —</option><option value="none">ללא רגישות</option><option value="sens">רגישות</option><option value="seek">חיפוש תחושה</option></select></td><td><input type="text" id="psn_' + r[0] + '" placeholder="פירוט" aria-label="' + r[1] + ' - פירוט"></td></tr>').join('') + '</table></div>';

        '<div class="ctl"><label class="lbl" for="calcName">שם המבחן / תת-המבחן</label><input type="text" id="calcName" placeholder="למשל: קואורדינציה דו-צדדית"></div>' +
        '<div class="ctl"><label class="lbl" for="calcScore">ציון</label><input type="number" step="any" id="calcScore"></div></div>' +
        '<div class="calcres" id="calcRes"></div><button class="btn" id="calcCopy" type="button">העתקת המשפט</button>' +
        '<p class="hint">חישוב לפי התפלגות נורמלית. אם במדריך המבחן מופיע אחוזון אחר, הוא הקובע.</p></div>';
    case 'agenote': return '<div class="agecheck" id="' + it.id + '" aria-live="polite"></div>';
    case 'goals':
      return '<div class="ctl"><span class="lbl" id="lb_goalChips">בנק מטרות (סדר הבחירה = סדר המטרות)</span><div id="goalSugg"></div><div class="chips" role="group" aria-labelledby="lb_goalChips" id="goalChips">' + GOALS.map(g => '<label><input type="checkbox" value="' + g[0] + '">' + esc(g[1]) + '</label>').join('') + '</div></div>';
  }
  return '';
}
function spRow(id, label){ return '<tr><td>' + esc(label) + '</td><td><select id="' + id + '" aria-label="' + esc(label) + '">' + SP2_LEVELS.map(l => '<option value="' + l[0] + '">' + l[1] + '</option>').join('') + '</select></td></tr>'; }
function optHtml(o){ return '<option value="' + esc(o[0]) + '">' + esc(o[0] === '' && !o[1] ? '— לא נבחר —' : o[1]) + '</option>'; }
// שם הכרטיס שבו נמצא פריט (לשדות בלי כותרת משלהם)
function cardTitleOf(id){
  let t = '';
  SECTIONS.forEach(s => s.cards.forEach(c => { const walk = it => { if (it.type === 'row') it.items.forEach(walk); else if (it.id === id) t = c.title; }; c.items.forEach(walk); }));
  return t;
}
function chipHtml(o){ return '<label' + (o[3] ? ' class="mine"' : '') + '><input type="checkbox" value="' + esc(o[0]) + '">' + esc(o[1]) + '</label>'; }

// ---------- הניסוחים שלי: צ'יפים שהמשתמשת מוסיפה, נשמרים בדפדפן ומסונכרנים לענן ----------
// קבוצות שבהן הטקסט נבנה מהתווית או מהבחירה עצמה, ולכן ניסוח חופשי לא מתאים להן
const NO_CUSTOM = ['joint', 'shapes', 'blocks'];
const PHRASE_STORE = 'ot_form_phrases_v1';
function loadPhrases(){ try { return JSON.parse(localStorage.getItem(PHRASE_STORE)) || {}; } catch(e){ return {}; } }
function savePhrases(p){ try { localStorage.setItem(PHRASE_STORE, JSON.stringify(p)); return true; } catch(e){ return false; } }
function applyPhrases(){
  const mine = loadPhrases();
  const walk = it => {
    if (it.type === 'row') return it.items.forEach(walk);
    if (it.type === 'chips' && mine[it.id]) mine[it.id].forEach(o => { if (!it.opts.some(x => x[0] === o[0])) it.opts.push([o[0], o[1], o[2], true]); });
  };
  SECTIONS.forEach(s => s.cards.forEach(c => c.items.forEach(walk)));
}
function chipItem(id){
  let f = null;
  const walk = it => { if (it.type === 'row') it.items.forEach(walk); else if (it.id === id) f = it; };
  SECTIONS.forEach(s => s.cards.forEach(c => c.items.forEach(walk)));
  return f;
}

// focus: מעבר שהמשתמשת ביקשה. הפוקוס עובר לכותרת השלב, כדי שקורא מסך יודיע עליו והמקלדת תמשיך משם

// ---- שינויים שאפשר לבטל: כל פעולה רושמת בדיוק מה שינתה, והביטול מחזיר רק את זה ----
const newRec = () => ({chips:[], sels:[], goals:[]});
const chipInput = (id, k) => document.querySelector('[data-chips="' + id + '"] input[value="' + CSS.escape(k) + '"]');
const markFilled = el => { const c = el.closest('.ctl'); if (c) c.classList.add('filled'); };
function recChip(rec, id, k, on){
  const i = chipInput(id, k); if (!i || i.checked === on) return false;
  rec.chips.push([id, k, i.checked]); i.checked = on; if (on) markFilled(i); return true;
}
function recSel(rec, id, v){
  const el = $(id); if (!el || el.value === v) return false;
  if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === v)) return false;
  rec.sels.push([id, el.value]); el.value = v; markFilled(el); return true;
}
function recGoal(rec, k){ if (goalOrder.includes(k)) return false; rec.goals.push(k); addGoal(k); return true; }
function undoRec(rec){
  rec.chips.slice().reverse().forEach(([id, k, prev]) => { const i = chipInput(id, k); if (i) i.checked = prev; });
  rec.sels.slice().reverse().forEach(([id, prev]) => { if ($(id)) $(id).value = prev; });
  goalOrder = goalOrder.filter(k => !rec.goals.includes(k));
  rec.goals.forEach(k => { const i = document.querySelector('#goalChips input[value="' + k + '"]'); if (i) i.checked = false; });
}
// האם סימון k בקבוצה id סותר משהו שכבר מסומן
function conflicts(id, k){
  return EXCL_GROUPS.some(g => { if (g[0] !== id) return false; const opp = g[1] === k ? g[2] : g[2] === k ? g[1] : null; const i = opp && chipInput(id, opp); return !!(i && i.checked); });
}
// "הכול תואם גיל": משלים רק מה שעדיין לא נבחר. לא מוחק קשיים שכבר סומנו ולא דורס בחירות.
function applyNormal(title){
  const n = NORM[title]; if (!n) return;
  const rec = newRec(); let skipped = 0;
  Object.entries(n.on || {}).forEach(([id, ks]) => ks.forEach(k => { if (conflicts(id, k)) skipped++; else recChip(rec, id, k, true); }));
  Object.entries(n.sel || {}).forEach(([id, v]) => { if ($(id) && $(id).value === '') recSel(rec, id, v); else if ($(id) && $(id).value !== v) skipped++; });
  update(); saveSession();
  const done = rec.chips.length + rec.sels.length;
  const msg = !done ? 'לא היה מה להשלים: כל הבחירות בתחום כבר מולאו.' :
    'סומן "תואם גיל"' + (skipped ? '. מה שכבר סימנת לא שונה' : '') + '. עכשיו אפשר לסמן רק את מה שחורג.';
  if (done) flashAction(msg, 'ביטול', () => { undoRec(rec); update(); saveSession(); }); else flash(msg);
}
function addGoal(k){ if (goalOrder.includes(k)) return; goalOrder.push(k); const i = document.querySelector('#goalChips input[value="' + k + '"]'); if (i) i.checked = true; }
// פרופיל פתיחה: פרופיל חדש מחליף את הקודם (מה שהקודם סימן ועדיין לא שונה, מוסר)
let presetActive = null;   // {id, rec}
function revertPreset(){
  if (!presetActive) return;
  undoRec(presetActive.rec); presetActive = null;
  document.querySelectorAll('.preset').forEach(b => b.classList.remove('on'));
}
function applyPreset(id){
  const p = PRESETS.find(x => x.id === id); if (!p) return;
  if (presetActive && presetActive.id === id) return;
  revertPreset();
  const rec = newRec();
  Object.entries(p.set).forEach(([k, v]) => {
    if (Array.isArray(v)) v.forEach(x => recChip(rec, k, x, true));
    else if ($(k) && $(k).value === '') recSel(rec, k, v);
  });
  p.goals.forEach(g => recGoal(rec, g));
  presetActive = {id, rec};
  document.querySelectorAll('.preset').forEach(b => b.classList.toggle('on', b.dataset.preset === id));
  update(); saveSession();
  const n = rec.chips.length + rec.sels.length + rec.goals.length;

    '<button type="button" class="linkbtn" id="undoPreset">ביטול הפרופיל</button></div>';
}

const AGE_NORMS = {
  shapes: {v: 2, h: 2.5, c: 3, x: 4, sq: 4.5, diag: 5, tri: 5.5},
  blocks: {tower: 2, train: 2.5, bridge: 3, steps: 4.5},

// מה שסומן ועדיין מתחת למצופה לגיל. רק לפריטים שנבדקו (משהו בקבוצה סומן או נבחר).
function ageGaps(){
  const a = ageYears(), out = {fm: [], cog: []};
  if (a === null) return out;
  const missing = (id, norms) => { const got = chips(id); if (!got.length) return [];
    return Object.entries(norms).filter(([k, y]) => y <= a && !got.includes(k)).map(([k, y]) => OPT[id][k].label + ' (מגיל ' + ageFmt(y) + ')'); };
  const sh = missing('shapes', AGE_NORMS.shapes);
  if (sh.length) out.fm.push('לא סומנו בהעתקה: ' + sh.join(', '));
  if (a >= AGE_NORMS.tripodBy && ['fist','palmar','digital'].includes(val('grip'))) out.fm.push('אחיזה ' + OPT.grip[val('grip')].label + ' (טריפוד מצופה מגיל ' + ageFmt(AGE_NORMS.tripodBy) + ')');

  if (a >= AGE_NORMS.meaningfulDrawBy && ['scrib','scribM','lines'].includes(val('draw'))) out.fm.push('שלב ציור: ' + OPT.draw[val('draw')].label + ' (ציור בעל משמעות מצופה מגיל ' + AGE_NORMS.meaningfulDrawBy + ')');

function suggestGoals(){

  else bad('לא צוינו חוזקות או תחומי עניין. לפי הנחיות החברה הישראלית לריפוי בעיסוק, הם חלק מסיכום האבחון.', 's_rep');

const SCALES = [['ss','ציון תקן (ממוצע 100, ס"ת 15)',100,15],['t','ציון T / ציון תקן של BOT-2 (50, 10)',50,10],['bot','ציון סולמי של תת-מבחן BOT-2 (15, 5)',15,5],['scaled','ציון סולמי (10, 3)',10,3],['z','ציון Z (0, 1)',0,1]];
function normCdf(z){
  const t = 1 / (1 + 0.3275911 * Math.abs(z) / Math.SQRT2);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-z * z / 2);

}
function pctFromScore(score, mean, sd){
  const p = normCdf((score - mean) / sd) * 100;

  if (p > 99) return Math.min(99.9, Math.round(p * 10) / 10);
  return Math.round(p);
}
function pctText(p){ p = Number(p); return p < 1 ? 'מתחת לאחוזון 1' : p > 99 ? 'מעל אחוזון 99' : 'באחוזון ' + p; }

  const manual = pe.value !== '' && pe.dataset.auto !== '1';
  if (manual) return;
  if (s.value === ''){ if (pe.dataset.auto === '1'){ pe.value = ''; delete pe.dataset.auto; } return; }
  pe.value = pctFromScore(Number(s.value), 100, 15); pe.dataset.auto = '1';
}

function pctPhrase(p){

function domainSummary(d){
  const sen = [];
  if (d === 'beh'){
    const coop = {part:'{שיתף|שיתפה} פעולה באופן חלקי', low:'שיתוף הפעולה היה נמוך'}[val('coop')];
    const eye = {incons:'קשר העין אינו עקבי', rare:'{יוצר|יוצרת} קשר עין לעיתים רחוקות'}[val('eye')];
    if (val('adapt') === 'med') sen.push('{נזקק|נזקקה} לזמן הסתגלות ולתיווך');
    [coop, eye].forEach(x => x && sen.push(x));
    // קשב קצר, מוסחות ותנועתיות במשפט אחד, כמו בממצאים
    const bk = chips('beh'), frag = ['dist','move'].filter(k => bk.includes(k)).map(k => ph('beh', k));
    NEG.beh.filter(k => bk.includes(k) && k !== 'dist' && k !== 'move').forEach(k => {
      let t = ph('beh', k); if (k === 'attShort' && frag.length){ t += ', ' + frag.join(', '); frag.length = 0; } sen.push(t);
    });
    if (frag.length) sen.push('נצפו ' + frag.join(' ו'));
    if (!sen.length){ const s0 = splitSentences(B.f_beh().split('\n')[0]).filter(x => !/לאבחון בליווי/.test(x)); return s0.slice(0, 2).join(' '); }
  }
  if (d === 'gm'){
    if (chips('gm').includes('notdone')) return 'לא נערכה תצפית על התפקוד במרחב.';
    sen.push(...negPhrases('gm'));
    const ay = lev => AYRES_ITEMS.filter(r => val('ay_' + r[0]) === lev).map(r => r[1].replace(/\s*\(.*\)$/, ''));
    if (ay('sig').length) sen.push('בתצפית הקלינית של איירס נצפה קושי משמעותי ב' + joinList(ay('sig')));
    if (ay('mild').length) sen.push((ay('sig').length ? 'וקושי קל ב' : 'בתצפית הקלינית של איירס נצפה קושי קל ב') + joinList(ay('mild')));
    // "תואם גיל" נשאר כשסומן, ואחריו רק הקשיים הקלים שנצפו
    if (chips('gm').includes('ok') && sen.length && !negPhrases('gm').length) sen.unshift(ph('gm', 'ok'));
  }
  if (d === 'fm'){
    if (['no','pref'].includes(val('dom'))) sen.push('דומיננטיות ידנית עדיין אינה מבוססת');
    if (val('grip') === 'effort') sen.push('{אוחז|אוחזת} את כלי הכתיבה באחיזה מאומצת, תוך הפעלת לחץ מוגבר');
    sen.push(...negPhrases('fm'));
    sen.push(lowScores('beery', BEERY, 'אבחון BEERY'));
  }
  if (d === 'wr'){
    sen.push(...negPhrases('wr'));
    const sp = {bitlow:'מעט נמוך מהמצופה', low:'נמוך מהמצופה'};
    if (sp[val('copyS')]) sen.push('קצב הכתיבה בהעתקה ' + sp[val('copyS')]);
    if (sp[val('dictS')]) sen.push('קצב הכתיבה בהכתבה ' + sp[val('dictS')]);
  }
  if (d === 'cog'){
    sen.push(...negPhrases('cog'));
    const low = MAP_IDX.filter(r => val('map_' + r[0] + '_p') !== '' && Number(val('map_' + r[0] + '_p')) <= 25).map(r => r[1] + ' (' + mapPhrase(val('map_' + r[0] + '_p')).replace(/, המעיד.*$/, '') + ')');
    if (low.length) sen.push('במבחן MAP: ' + low.join(', '));

  if (d === 'play') sen.push(...negPhrases('play'));
  if (d === 'sens'){
    const lines = B.f_sens().split('\n');
    const mean = lines.find(l => /^על פי תוצאות השאלון/.test(l));
    if (mean) sen.push(mean.replace(/^על פי תוצאות השאלון, \S+ /, 'על פי שאלון הפרופיל החושי, [שם] '));
    if (val('sensConcl')) sen.push(OPT.sensConcl[val('sensConcl')].label);
  }
  const t = sentences(sen.filter(Boolean));
  if (t) return G(t);
  const all = { gm: B.f_gm, fm: B.f_fm, wr: B.f_wr, cog: B.f_cog, play: B.f_play, sens: B.f_sens }[d];
  return all ? firstSentence(all()) : '';
}

function nameList(){
  const arr = [val('name')].concat(val('names2').split(/[,\n]+/).map(s => s.trim()));
  return arr.map((n, i) => ({name:n, token: i === 0 ? '[שם]' : '[שם' + (i+1) + ']'}))
    .concat([{name: val('surname'), token: '[שם משפחה]'}]).filter(x => x.name.length >= 2);
}
function showNames(t){ nameList().forEach(x => { t = t.split(x.token).join(x.name); }); return t; }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
// מחליף רק את השמות בתגיות ([שם], [שם משפחה]...). hideNames מסיר בנוסף גם תאריכים, טלפונים וכו'.
function tokenizeNames(t){
  nameList().sort((a,b) => b.name.length - a.name.length).forEach(x => {
    const re = new RegExp('(?<![\\u05D0-\\u05EA])([ובלמהשכ]{0,3})' + escRe(x.name) + '(?![\\u05D0-\\u05EA])', 'g');
    t = t.replace(re, (m, p) => p + x.token);
  });
  return t;
}
function hideNames(t){
  t = tokenizeNames(t);
  // ביטחון נוסף: תאריכים, טלפונים, מספרי זהות ומיילים
  t = t.replace(/[\w.+\-]+@[\w\-]+(\.[\w\-]+)+/g, '[מייל]')
       .replace(/(?<!\d)(?:\+972[\-\s]?|0)(?:5\d|7\d|[23489])[\-\s]?\d{3}[\-\s]?\d{4}(?!\d)/g, '[טלפון]')
       .replace(/(?<!\d)\d{8,9}(?!\d)/g, '[מספר מזהה]')
       .replace(/(?<!\d)\d{1,2}[.\/\-]\d{1,2}[.\/\-](?:\d{4}|\d{2})(?!\d|[.\/]\d)/g, '[תאריך]');
  return t;
}

    const a = e.target.getAttribute('data-addtxt');
    if (a){ $('of_' + a).classList.add('open'); $('o_' + a).focus(); }
  });
}
function markField(k){

// =====================================================================
//  ניסוח בעזרת Claude (חיבור ישיר, אחרי הסתרת שמות ואישור)
// =====================================================================
// =====================================================================
//  חיבור ישיר ל-Claude (בלי n8n). המפתח נשמר מוצפן בדפדפן ונפתח עם קוד.
// =====================================================================
const API_URL = 'https://api.anthropic.com/v1/messages';
const KEY_STORE = 'ot_form_api_key_v1';
const MODEL_STORE = 'ot_form_model_v1';
const DEFAULT_MODEL = 'claude-sonnet-5-5';
// מודלים שתומכים במעבר אוטומטי למודל חלופי כשהבקשה נדחית בטעות ע"י מסנני הבטיחות
const FALLBACK_MODELS = ['claude-sonnet-5-5', 'claude-opus-5-5', 'claude-opus-5', 'claude-fable-5-1'];
const MAX_TOKENS = 32000;
let apiKey = null;        // בזיכרון בלבד, נמחק בסגירת הדף
let keyAfter = null;      // פעולה להמשיך אחרי פתיחת המפתח

const b64 = u8 => { let s = ''; u8.forEach(c => s += String.fromCharCode(c)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function store(k, v){ try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; } catch(e){ return false; } }
function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function hasStoredKey(){ return !!load(KEY_STORE); }
function getModel(){ return load(MODEL_STORE) || DEFAULT_MODEL; }

async function deriveAes(code, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function saveKey(key, code){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await deriveAes(code, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, new TextEncoder().encode(key)));
  if (!store(KEY_STORE, JSON.stringify({v:1, salt:b64(salt), iv:b64(iv), ct:b64(ct)}))) throw new Error('הדפדפן לא מאפשר שמירה. המפתח יישאר פתוח רק עד סגירת הדף.');
}
async function unlockKey(code){
  const s = JSON.parse(load(KEY_STORE));
  const k = await deriveAes(code, unb64(s.salt));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(s.iv)}, k, unb64(s.ct));   // נכשל אם הקוד שגוי
  return new TextDecoder().decode(pt);
}

function keyStatus(){
  const b = $('keyBtn');
  if (PROXY.url){ b.textContent = accessCode() ? 'קוד גישה: מוגדר' : 'קוד גישה'; b.classList.toggle('ok', !!accessCode()); return; }

let modalReturn = null;   // האלמנט שהפוקוס יחזור אליו כשהחלון נסגר

// הפוקוס נשאר בתוך החלון הפתוח
function trapFocus(e){
  if (e.key !== 'Tab' || $('modalWrap').hidden) return;

  if (!els.length) return;
  const first = els[0], last = els[els.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  else if (!$('modal').contains(document.activeElement)){ e.preventDefault(); first.focus(); }
}

async function keyAction(act){
  const v = id => ($(id) ? $(id).value.trim() : '');
  if ($('kModel')){ const m = v('kModel'); store(MODEL_STORE, m && m !== DEFAULT_MODEL ? m : null); }
  try {
    if (act === 'close'){ closeModal(); keyAfter = null; return; }
    if (act === 'acc-forget'){ store(ACCESS_STORE, null); keyStatus(); closeModal(); flash('קוד הגישה נמחק מהדפדפן'); return; }
    if (act === 'acc-save'){
      const c = v('aCode');
      if (c.length < 8) return openAccessPanel(keyAfter, 'קוד הגישה צריך להיות באורך 8 תווים לפחות.');
      if (!store(ACCESS_STORE, c)) return openAccessPanel(keyAfter, 'הדפדפן לא מאפשר שמירה.');
      keyStatus(); closeModal(); const next = keyAfter; keyAfter = null; if (next) next(); return;
    }
    if (act === 'lock'){ apiKey = null; keyStatus(); closeModal(); flash('המפתח ננעל'); return; }
    if (act === 'forget'){
      if (!confirm('למחוק את המפתח השמור מהמחשב הזה? תצטרכי להזין אותו מחדש.')) return;
      store(KEY_STORE, null); apiKey = null; keyStatus(); openKeyPanel(keyAfter); return;
    }
    if (act === 'unlock'){
      try { apiKey = await unlockKey(v('kCode')); } catch(e){ openKeyPanel(keyAfter, 'הקוד שגוי.'); return; }
    }
    if (act === 'save'){
      const key = v('kKey'), c1 = v('kCode'), c2 = v('kCode2');
      if (!/^sk-ant-/.test(key)) { openKeyPanel(keyAfter, 'המפתח לא נראה כמו מפתח של Anthropic (sk-ant-...).'); return; }
      if (c1.length < 6) { openKeyPanel(keyAfter, 'הקוד צריך להיות לפחות 6 תווים.'); return; }
      if (c1 !== c2) { openKeyPanel(keyAfter, 'שני הקודים לא זהים.'); return; }
      try { await saveKey(key, c1); } catch(e){ flash(e.message); }
      apiKey = key;
    }
    keyStatus(); closeModal();
    const next = keyAfter; keyAfter = null;
    if (next) next();
  } catch (e){ openKeyPanel(keyAfter, e.message); }
}

// קריאה ל-Claude בהזרמה (stream), כדי להציג התקדמות ולא להיתקע על בקשות ארוכות.
// onProgress מקבל את מספר התווים שהתקבלו עד עכשיו.
// ---- Worker מתווך: כשמוגדרת כתובת, הבקשות עוברות דרכו עם קוד גישה אישי, וההוראות ל-Claude
// נמצאות ב-Worker ולא כאן. כל עוד הכתובת ריקה, הטופס פונה ל-Claude ישירות עם מפתח API, כמו קודם.
const PROXY = {url: 'https://ot-form-proxy.oriel7ai.workers.dev'};
const ACCESS_STORE = 'ot_form_access_v1';
const accessCode = () => load(ACCESS_STORE) || '';
const claudeReady = () => PROXY.url ? !!accessCode() : !!apiKey;
function openAccessPanel(after, msg){
  keyAfter = after || null;
  openModal('<h3>קוד גישה</h3><p>הקוד האישי שקיבלת מאפשר להשתמש בניסוח ובשליפה בעזרת Claude. הוא נשמר בדפדפן הזה בלבד.</p>' +
    '<label class="lbl" for="aCode">קוד הגישה</label><input type="password" id="aCode" autocomplete="off" value="' + esc(accessCode()) + '">' +
    '<div class="mrow"><button class="btn primary" data-k="acc-save">שמירה</button>' + (accessCode() ? '<button class="btn" data-k="acc-forget">מחיקת הקוד</button>' : '') + '<button class="btn" data-k="close">ביטול</button></div>' +
    (msg ? '<div class="warnbox" style="margin-top:10px">' + esc(msg) + '</div>' : ''));
}

// opts.model: מודל אחר מברירת המחדל; opts.format: מבנה תשובה מובטח (structured outputs);
// opts.kind ('polish' / 'extract') ו-opts.style: לפיהם ה-Worker בוחר את ההוראות
async function callClaude(system, user, onProgress, opts){
  opts = opts || {};
  const model = opts.model || getModel();
  let url = API_URL, headers, body;
  if (PROXY.url){
    url = PROXY.url;
    headers = {'content-type': 'application/json', 'x-ot-code': accessCode()};
    body = {kind: opts.kind || 'polish', style: opts.style || 'inst', user, model, format: opts.format};
  } else {
    headers = {'content-type':'application/json', 'x-api-key':apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'};
    body = {model, max_tokens:MAX_TOKENS, stream:true, system, messages:[{role:'user', content:user}]};
    if (opts.format) body.output_config = {format: opts.format};
    if (FALLBACK_MODELS.includes(model)){ headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
  }
  let res;
  try { res = await fetch(url, {method:'POST', headers, body: JSON.stringify(body)}); }
  catch (e){ throw new Error('אין חיבור ל-Claude. בדקי את חיבור האינטרנט.'); }
  if (!res.ok){
    const data = await res.json().catch(() => ({}));
    const m = (data.error && data.error.message) || '';
    if (res.status === 401) throw new Error(PROXY.url ? 'קוד הגישה לא תקין או בוטל. פתחי את "קוד גישה" בתפריט "עוד".' : 'המפתח לא תקין או בוטל (401). פתחי את "הגדרת מפתח" והזיני מפתח חדש.');
    if (res.status === 429 && PROXY.url && m) throw new Error(m);   // מגבלת השימוש היומית של ה-Worker
    if (res.status === 429) throw new Error('יותר מדי בקשות או שנגמרה המכסה (429). נסי שוב בעוד דקה, ובדקי את תקרת ההוצאה.');
    if (res.status === 529 || res.status >= 500) throw new Error('השרת של Claude עמוס כרגע (' + res.status + '). נסי שוב בעוד כמה דקות.');
    const err = new Error('Claude החזיר שגיאה ' + res.status + (m ? ': ' + m : '')); err.status = res.status; throw err;
  }
  const sse = parseSSE(await readStream(res, n => onProgress && onProgress(n)));
  if (sse.error) throw new Error('Claude החזיר שגיאה באמצע התשובה: ' + sse.error);
  if (sse.stop === 'max_tokens') throw new Error('התשובה של Claude נקטעה כי הייתה ארוכה מדי. אפשר לנסות שוב עם פחות שדות מלאים.');
  if (sse.stop === 'refusal') throw new Error('Claude סירב לבקשה (מסנן הבטיחות). זה קורה לפעמים בטעות; אפשר לנסות שוב או לנסח מחדש את השדות.');
  return sse.text;
}
// קורא את גוף התשובה כטקסט, ומדווח כמה תווים של תוכן הגיעו
async function readStream(res, onChars){
  if (!res.body || !res.body.getReader) return res.text();
  const rd = res.body.getReader(), dec = new TextDecoder();
  let all = '', chars = 0;
  for (;;){
    const {done, value} = await rd.read(); if (done) break;
    const chunk = dec.decode(value, {stream:true}); all += chunk;
    const m = chunk.match(/"text_delta","text":"(?:[^"\\]|\\.)*"/g);
    if (m){ chars += m.reduce((a, s) => a + s.length - 22, 0); onChars(chars); }   // הערכה: אורך המחרוזת בלי העטיפה "text_delta","text":"…"
  }
  return all + dec.decode();
}
// מפענח אירועי SSE של Messages API לטקסט הסופי, סיבת העצירה ושגיאה אם הייתה
function parseSSE(raw){
  let text = '', stop = null, error = null;
  raw.split(/\r?\n/).forEach(line => {
    if (!line.startsWith('data:')) return;
    let ev; try { ev = JSON.parse(line.slice(5)); } catch(e){ return; }
    if (ev.type === 'content_block_start' && ev.content_block && ev.content_block.type === 'fallback') text = '';   // מודל חלופי ממשיך מכאן; מה שנכתב לפני כן נזרק
    else if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') text += ev.delta.text;
    else if (ev.type === 'message_delta' && ev.delta && ev.delta.stop_reason) stop = ev.delta.stop_reason;
    else if (ev.type === 'error') error = (ev.error && ev.error.message) || 'שגיאה לא ידועה';
  });
  return {text, stop, error};
}
// =====================================================================
//  טיוטה מוצפנת: שמירה לקובץ ופתיחה ממנו (למעבר בין טלפון למחשב)
// =====================================================================
const DRAFT_SKIP = ['polishStyle', 'imFiles', 'imPaste', 'imExtra', 'kKey', 'kCode', 'kCode2', 'kModel', 'dPass', 'dPass2'];
// withImport: גם הטקסט שיובא (המקורי, לפני הסרת הפרטים). רק לטיוטות המוצפנות, לא לשמירה האוטומטית.
function collectState(withImport){
  const st = {v:1, ctl:{}, chips:{}, goals:goalOrder.slice(), out:{}};
  document.querySelectorAll('header input[id], header select[id], #pages input[id], #pages select[id], #pages textarea[id]').forEach(el => {
    if (DRAFT_SKIP.includes(el.id) || el.id.startsWith('o_') || el.type === 'file' || el.type === 'checkbox') return;   // שדות הדוח נשמרים בנפרד (out)
    if (el.value !== '') st.ctl[el.id] = el.value;
  });
  document.querySelectorAll('[data-chips]').forEach(box => {
    const k = [...box.querySelectorAll('input:checked')].map(i => i.value);
    if (k.length) st.chips[box.getAttribute('data-chips')] = k;
  });
  FIELDS.forEach(f => { if (dirty[f[0]]) st.out[f[0]] = {t: $('o_' + f[0]).value, ai: !!aiDone[f[0]]}; });
  if (withImport && importRaw) st.imp = {raw: importRaw, extra: val('imExtra'), mode: importMode, src: importSources.slice()};
  return st;
}
// יש תוכן אם משהו שונה מברירת המחדל (בחירה ראשונה ברשימה, כמו המגדר או סוג הציון במחשבון, לא נחשבת)
function hasContent(){
  const s = collectState();
  const changed = k => { const el = $(k); return !(el && el.tagName === 'SELECT' && el.options[0] && el.options[0].value === s.ctl[k]); };
  return !!(Object.keys(s.chips).length || s.goals.length || Object.keys(s.out).length || Object.keys(s.ctl).some(changed));
}
// ---- גרסאות של פורמט הטיוטה: כששם של שדה משתנה, מוסיפים כאן המרה מהגרסה הקודמת ----
const CURRENT_STATE_VERSION = 1;
const STATE_MIGRATIONS = {
  // 1: s => { const n = structuredClone(s); /* שינוי שמות שדות */ n.v = 2; return n; },
};
function migrateState(st){
  if (!st || typeof st !== 'object') return st;
  let cur = st;
  while ((cur.v || 1) < CURRENT_STATE_VERSION){ const fn = STATE_MIGRATIONS[cur.v || 1]; if (!fn) break; cur = fn(cur); }
  return cur;
}
function restoreState(st){
  st = migrateState(st);
  document.querySelectorAll('[data-chips] input, #goalChips input').forEach(i => i.checked = false);
  document.querySelectorAll('.ctl.filled, .preset.on').forEach(c => c.classList.remove('filled', 'on'));
  presetActive = null; if ($('presetMsg')) $('presetMsg').innerHTML = '';
  document.querySelectorAll('header input[id], #pages input[id], #pages select[id], #pages textarea[id]').forEach(el => {
    if (DRAFT_SKIP.includes(el.id) || el.id.startsWith('o_') || el.type === 'file' || el.type === 'checkbox') return;
    el.value = el.tagName === 'SELECT' ? (el.options[0] ? el.options[0].value : '') : '';
  });
  Object.keys(st.ctl || {}).forEach(id => { const el = $(id); if (el) el.value = st.ctl[id]; });

async function encryptJson(obj, pass){

}

function DraftError(m){ const e = new Error(m); e.show = true; return e; }
// מקלדת עברית תקנית: מקש באנגלית -> האות שהוא מקליד בפריסה העברית
const HEB_KEYS = {q:'/', w:"'", e:'ק', r:'ר', t:'א', y:'ט', u:'ו', i:'ן', o:'ם', p:'פ', a:'ש', s:'ד', d:'ג', f:'כ', g:'ע', h:'י', j:'ח', k:'ל', l:'ך', ';':'ף', "'":',', z:'ז', x:'ס', c:'ב', v:'ה', b:'נ', n:'מ', m:'צ', ',':'ת', '.':'ץ', '/':'.'};

// טעויות הקלדה נפוצות בסיסמה: רווח בקצה, שפת מקלדת, Caps Lock, אות ראשונה גדולה בטלפון
function passVariants(p){
  const swap = t => [...t].map(c => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()).join('');
  const toHeb = t => [...t].map(c => HEB_KEYS[c] || c).join('');
  const toEng = t => [...t].map(c => ENG_KEYS[c] || c).join('');
  const first = t => t ? swap(t[0]) + t.slice(1) : t;
  const out = [];
  [p, p.trim()].forEach(b => [b, toHeb(b), toEng(b), toHeb(b.toLowerCase()), swap(b), first(b)].forEach(v => { if (v && !out.includes(v)) out.push(v); }));

}
async function decryptJson(text, pass, onTry){
  let f;

  if (!f || f.type !== 'ot-report-draft') throw DraftError('הקובץ אינו טיוטה של הטופס.');

    if (v !== pass) st._passNote = 'הסיסמה התאימה אחרי תיקון של טעות הקלדה';
    st._pass = v;

  }
  throw DraftError('הסיסמה לא מתאימה לקובץ. הקובץ עצמו תקין. בדקו את שפת המקלדת, Caps Lock, ומספרים מול אותיות דומות (0 ו-O, 1 ו-l).');
}

  if (f) raw = unb64(JSON.parse(await gRead(f.id)).k);
  else { raw = crypto.getRandomValues(new Uint8Array(32)); await gCreate(G_KEY_FILE, JSON.stringify({v: 1, k: b64(raw)})); }
  return gAesKey = await crypto.subtle.importKey('raw', raw, {name: 'AES-GCM'}, false, ['encrypt', 'decrypt']);
}
async function gEncrypt(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await gKey(), new TextEncoder().encode(JSON.stringify(obj))));
  return JSON.stringify({type: 'ot-report-cloud', v: 1, iv: b64(iv), ct: b64(ct)});
}
async function gDecrypt(text){
  let f; try { f = JSON.parse(text); } catch(e){ throw DraftError('הטיוטה בענן פגומה.'); }
  try { return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(f.iv)}, await gKey(), unb64(f.ct)))); }
  catch(e){ throw DraftError('לא הצלחתי לפענח את הטיוטה. ייתכן שקובץ המפתח בתיקייה נמחק או הוחלף.'); }
}

// מחלץ את אובייקט ה-JSON מתשובת Claude: גם כשהוא עטוף ב-```json או בטקסט, וגם כשיש בו שבירת שורה
// גולמית בתוך מחרוזת. אם אין JSON תקין נזרקת שגיאה עם הסבר, ואף שדה לא משתנה.
function parseJsonReply(t){
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i), src = fence ? fence[1] : t;
  const a = src.indexOf('{'), z = src.lastIndexOf('}');
  if (a < 0 || z <= a) throw new Error('Claude לא החזיר תשובה במבנה הצפוי.');
  const slice = src.slice(a, z + 1);
  const ok = v => { if (!v || typeof v !== 'object' || Array.isArray(v)) throw 0; return v; };
  try { return ok(JSON.parse(slice)); } catch(e){}
  try { return ok(JSON.parse(slice.replace(/"(?:[^"\\]|\\.)*"/g, m => m.replace(/\r?\n/g, '\\n')))); }
  catch(e){ throw new Error('התשובה של Claude לא הייתה במבנה תקין (JSON).'); }
}
function fieldTitle(k){ const f = FIELDS.find(x => x[0] === k); return f ? f[1] : k; }

const STYLE_GUIDE = `אתה עוזר למרפאה בעיסוק במכון להתפתחות הילד בישראל לנסח שדות של דוח סיכום אבחון שמוזן למערכת Cliks.
קיבלת שדות שכבר מכילים את הממצאים. התפקיד שלך הוא ללטש את הניסוח לפרוזה רציפה ומקצועית בסגנון של המכון, ולכתוב סיכום.

כללי ברזל:
1. אסור להוסיף ממצא, אבחנה, ציון או פרט שלא מופיע בשדות. אם שדה ריק, החזר אותו ריק.
2. אסור לשנות ציונים, אחוזונים, זמנים או מספרים.
3. תגיות כמו [שם], [שם2], [שם משפחה], [תאריך] הן פרטים שהוסרו. העתק אותן בדיוק כמו שהן, במקומות המתאימים.
4. שמור על המגדר שצוין לאורך כל הטקסט.
5. אל תקבע אבחנה רפואית. תאר תפקוד.

סגנון המכון:
- גוף שלישי, זמן הווה בתיאור תפקוד ("מראה", "נצפה", "ניכר", "בולט", "עולה רושם", "נראה כי"), עבר בתיאור מהלך האבחון ("הגיע", "שיתף פעולה").
- משפטים קליניים, תמציתיים וחמים. תיאורים כמו "ילד מקסים", "ילדה מתוקה" מקובלים בפתיחה.
- ניסוחים אופייניים: "תואם גיל", "בטווח הנורמה לגילו", "בהתאם למצופה בגילו", "לצד צורך בתיווך", "ייתכן גם על רקע קשבי", "עם זאת,".
- רקע: נפתח במשפט "[שם] ילד מקסים בן 4.1. הגיע לאבחון בריפוי בעיסוק בהפניית ... בשל ...", ואחריו נתוני לידה, התפתחות ובריאות.
- ממצאים: פסקה רציפה לכל תחום. אפשר להשתמש בתבנית "בתחום X- ..." כשמתאים.
- Beery: "באבחון BEERY, בחלק הבודק אינטגרציה ויזו-מוטורית קיבל ציון באחוזון 30, בטווח הנורמה לגילו, מתחת לממוצע."
- לפי הנחיות החברה הישראלית לריפוי בעיסוק: כשבשדות יש מידע על השפעת הקשיים על התפקוד וההשתתפות בבית ובמסגרת החינוכית, קשר אליו את הממצאים. אל תכתוב השפעה תפקודית שלא כתובה בשדות. הסיכום כולל את החוזקות ואת תחומי העניין של הילד, אם צוינו.
- סיכום: קיבלת טיוטת סיכום. שמור על המבנה שלה: משפט הפתיחה, משפט על ההתנהגות ושיתוף הפעולה באבחון, ואחריו תחום אחר תחום בתבנית "בתחום המוטורי- ...", "בתחום התפיסה והחשיבה- ...".
- בסיכום אסור להשמיט קושי, ממצא חריג או ציון מתחת לנורמה שמופיעים בטיוטה. אפשר לקצר ולאחד רק תיאורים של תפקוד תקין. בלי מידע שלא מופיע בממצאים.

החזר אך ורק אובייקט JSON תקין עם אותם מפתחות שקיבלת, בלי טקסט נוסף.`;

const ICF_GUIDE = `אתה עוזר למרפאה בעיסוק התפתחותית בכירה במכון להתפתחות הילד בישראל לנסח שדות של דוח סיכום אבחון שמוזן למערכת Cliks.
קיבלת שדות שכבר מכילים את הממצאים. התפקיד שלך הוא לנסח אותם כדוח אינטגרטיבי לפי מודל ה-ICF, בגישה מבוססת חוזקות, ולכתוב סיכום.

כללי ברזל:
1. אסור להוסיף ממצא, אבחנה, ציון או פרט שלא מופיע בשדות. אם שדה ריק, החזר אותו ריק.
2. אסור לשנות, לעגל או להשמיט ציונים, אחוזונים, ציוני תקן, זמנים או מספרים.
3. תגיות כמו [שם], [שם2], [שם משפחה], [תאריך] הן פרטים שהוסרו. העתק אותן בדיוק כמו שהן, במקומות המתאימים.
4. שמור על המגדר שצוין לאורך כל הטקסט.
5. אל תקבע אבחנה רפואית. תאר תפקוד.

סגנון אינטגרטיבי (ICF):
- אל תכתוב רשימה של ממצאים מבודדים. קשר בין מרכיבי התפקוד (מוטוריקה גסה ועדינה, ויסות חושי, תפיסה, קשב וארגון) לבין ההשתתפות של הילד ביומיום: עצמאות בתפקודי יומיום, משחק, ולמידה בגן או בבית הספר.
- קשר שכתוב בשדות (למשל בהשפעה על התפקוד, או בדיווח ההורים והמסגרת): כתוב אותו כרגיל.
- קשר שאתה מסיק בעצמך ואינו כתוב בשדות: מותר להציע אותו רק אם הוא נשען על ממצא שמופיע בשדות, וחובה לעטוף את כל המשפט בסימון [לבדיקה: ...], כדי שהמאבחנת תאשר או תמחק. בתוך הסימון אל תשתמש בסוגריים מרובעים.
  דוגמה: "[לבדיקה: הקושי בשמירה על יציבה בישיבה עשוי להשפיע על ההתמדה במטלות גרפומוטוריות ליד שולחן.]"
- שפה מקצועית, מכבדת ולא שיפוטית. למשל, במקום "לא משתף פעולה": "נזקק לתיווך ולחיזוקים לשם גיוס והתמדה במטלה".
- גוף שלישי, זמן הווה בתיאור תפקוד, עבר בתיאור מהלך האבחון ("הגיע", "שיתף פעולה").
- ממצאים: פסקה רציפה לכל תחום, שפותחת במה שתקין ושמור בתחום, ואחריו מוקדי הקושי.
- Beery: "באבחון BEERY, בחלק הבודק אינטגרציה ויזו-מוטורית קיבל ציון באחוזון 30, בטווח הנורמה לגילו, מתחת לממוצע."
- סיכום: קיבלת טיוטת סיכום. פתח במשפט הפתיחה, ואחריו בחוזקות, בתחומי העניין ובתפקודים השמורים של הילד. אחריהם תאר את מוקדי הקושי תחום אחר תחום, וקשר אותם להשתתפות היומיומית לפי הכללים שלמעלה.
- בסיכום אסור להשמיט קושי, ממצא חריג או ציון מתחת לנורמה שמופיעים בטיוטה. אפשר לקצר ולאחד רק תיאורים של תפקוד תקין. בלי מידע שלא מופיע בממצאים.

החזר אך ורק אובייקט JSON תקין עם אותם מפתחות שקיבלת, בלי טקסט נוסף.`;

// קשרים ש-Claude הציע ועוד לא אושרו
const REVIEW_RE = /\[לבדיקה:[^\]]*\]/g;
const reviewCount = t => (t.match(REVIEW_RE) || []).length;
function fieldsWithReview(){ return FIELDS.filter(f => reviewCount($('o_' + f[0]).value)); }
// לפני העתקה או ייצוא: אם נשארו קשרים לבדיקה, לשאול
function reviewGuard(fields){
  const left = fields.filter(f => reviewCount($('o_' + f[0]).value));
  if (!left.length) return true;
  return confirm('בדוח יש קשרים שמסומנים [לבדיקה: ...] ועוד לא אושרו (' + left.map(f => f[1]).join(', ') + ').\nלאשר קשר: למחוק רק את הסימון. לדחות: למחוק את כל המשפט.\n\nלהמשיך בכל זאת?');

async function polish(){
  const payload = {};

  if (!Object.keys(payload).length){ flash('אין עדיין טקסט לניסוח'); return; }

  const preview = user.split('\n')[0] + '\n\n' + Object.keys(payload).map(k => '— ' + fieldTitle(k) + ' —\n' + payload[k]).join('\n\n');
  if (!(await confirmSend('ניסוח בעזרת Claude', preview))) return;
  const btn = $('polish'); btn.disabled = true; btn.textContent = 'מנסח...';
  try {
    const obj = parseJsonReply(await callClaude(STYLES[getStyle()].guide, user, n => { btn.textContent = 'מנסח... (' + n + ' תווים)'; }, {kind: 'polish', style: getStyle()}));
    // שומרים את המצב הקודם של כל שדה, כדי שאפשר יהיה לבטל את הניסוח
    const before = {};
    let n = 0;

}
function list(v){ return v.split(/[\n,،]+/).map(s => s.trim()).filter(Boolean); }

const TOKEN_RE = /(\[שם\d*\]|\[שם משפחה\]|\[תאריך\]|\[טלפון\]|\[מספר מזהה\]|\[מייל\])/;
function renderImportPreview(){
  const r = importRes;
  const parts = r.text.split(/([-])/);
  let html = '', flags = 0;
  parts.forEach(p => {
    if (/^[-]$/.test(p)){
      const it = r.items[p.charCodeAt(1) - 0xE100];
      html += '<span class="r" title="' + esc('מקור: ' + it.orig) + '">' + esc(it.token) + '</span>';
      return;
    }
    p.split(TOKEN_RE).forEach(seg => {
      if (TOKEN_RE.test(seg) && /^\[.*\]$/.test(seg)){ html += '<span class="r">' + esc(seg) + '</span>'; return; }
      const fl = DEID.findFlags(seg); flags += fl.length;
      let last = 0, m; const reW = /[א-ת][א-ת"'\-]*[א-ת]|[א-ת]|\d+/g;
      while ((m = reW.exec(seg))){
        const s = m.index, e = s + m[0].length;
        html += esc(seg.slice(last, s));
        const f = fl.some(x => x[0] < e && x[1] > s);
        html += '<span class="w' + (f ? ' fl' : '') + '" data-w="' + esc(m[0]) + '">' + esc(m[0]) + '</span>';
        last = e;
      }
      html += esc(seg.slice(last));
    });
  });
  $('imPreview').innerHTML = html;
  const removed = r.items.length + (r.text.match(new RegExp(TOKEN_RE.source, 'g')) || []).length;
  $('imInfo').innerHTML = '<span class="chip-s">נקראו: ' + esc(importSources.join(', ')) + '</span><span class="chip-s">הוסרו: ' + removed + '</span>' + (flags ? '<span class="chip-s fl">לבדיקה: ' + flags + '</span>' : '');
  // הצעה: שם משפחה שזוהה בטקסט ועדיין לא הוסר
  const sur = DEID.surnameCandidates(DEID.toPlain(r)).filter(w => w !== val('surname'));
  if (sur.length) $('imInfo').innerHTML += '<div class="warnbox" style="margin-top:8px">ייתכן שזה שם משפחה שלא הוסר: ' +
    sur.map(w => '<b>' + esc(w) + '</b> <button type="button" class="linkbtn" data-sur="' + esc(w) + '">הסרה</button>').join(' · ') + '</div>';
}
function importOutgoing(){ return importRes ? DEID.toPlain(importRes) : ''; }

// ---- מילוי לפי כותרות (בלי בינה מלאכותית) ----
const HEAD_MAP = [
  [/רקע התפתחותי|רקע רפואי|אנמנזה|היריון ולידה/, 'bgNote'],
  [/טיפולים בעבר|אבחונים קודמים|טיפולים קודמים/, 'prevTx'],
  [/רקע משפחתי/, 'famNote'],
  [/דיווח ההורים|דיווח הורים|שאלון הורים|שיחה עם ההורים|שיחה עם האם/, 'parNote'],
  [/דיווח מסגרת|דיווח הגננת|דיווח גננת|שאלון גננת|שאלון מורה|דיווח המורה/, 'schNote'],
];
function isHeading(line){ const t = line.trim(); return t.length > 2 && t.length <= 45 && /[:：]$/.test(t); }
function fillByHeadings(){
  const text = importOutgoing();
  if (!text){ flash('קודם קראי קובץ'); return; }
  const found = {};
  let cur = null;
  text.split('\n').forEach(line => {
    if (isHeading(line)){ const h = HEAD_MAP.find(x => x[0].test(line)); cur = h ? h[1] : null; return; }
    if (cur && line.trim()) (found[cur] = found[cur] || []).push(line.trim());
  });
  let n = 0;
  Object.keys(found).forEach(id => { if (setCtl(id, found[id].join('\n'))) n++; });
  update();
  $('imStatus').innerHTML = n ? '<div class="okbox">מולאו ' + n + ' שדות לפי כותרות הקובץ (מסומנים במסגרת). בדקי אותם בלשוניות רקע ודיווחים.</div>' : '<div class="warnbox">לא נמצאו כותרות מוכרות בקובץ. נסי "שליפה בעזרת Claude".</div>';
}

// ---- כתיבה לשדה בטופס: לא דורסת מה שכבר מולא ----
function setCtl(id, value){
  if (value === undefined || value === null || value === '') return false;
  const box = document.querySelector('[data-chips="' + id + '"]');
  if (box){
    const keys = Array.isArray(value) ? value : [value]; let ch = false;
    keys.forEach(k => { const inp = box.querySelector('input[value="' + CSS.escape(String(k)) + '"]'); if (inp && !inp.checked){ inp.checked = true; ch = true; } });
    if (ch) box.closest('.ctl').classList.add('filled');
    return ch;
  }
  const el = $(id); if (!el) return false;
  if (el.tagName === 'SELECT'){
    if (el.value !== '' || ![...el.options].some(o => o.value === String(value))) return false;
    el.value = String(value);
  } else if (el.tagName === 'TEXTAREA'){
    const cur = el.value.trim(), add = String(value).trim();
    if (cur.includes(add)) return false;   // הקטע כבר נמצא בשדה (למשל אחרי לחיצה כפולה)
    el.value = cur ? cur + '\n' + add : add;
  } else {
    if (el.value.trim()) return false;
    el.value = String(value);
  }
  (el.closest('.ctl') || el).classList.add('filled');
  return true;
}

// ---- שליפה בעזרת Claude (הטקסט נשלח רק אחרי הסרת פרטים מזהים) ----
// ---- שליפה וניתוח בעזרת Claude ----
// שני סוגי טקסט: "מסמכים קודמים" ממלאים רקע ודיווחים; "הרשמים שלי מהאבחון הנוכחי" ממלאים גם ממצאים,
// ציונים ותצפיות. ממצאים לעולם לא נלקחים ממסמכים קודמים, כדי שהדוח יתאר רק את מה שנצפה עכשיו.
const EXTRACT_MODEL = 'claude-opus-5-5';
const EXTRACT_MAX = 100000;           // תווים שנשלחים בשליפה אחת
const PREV_TOOLS = ['q_par', 'q_gan', 'q_teach', 'talk'];   // מה שאפשר ללמוד ממסמכים על אמצעי ההערכה הנוכחיים
let importMode = 'prev';              // 'prev' | 'notes'
let extractItems = [];                // הצעות שממתינות לאישור
function extractSchema(mode){
  mode = mode || importMode;
  const sc = {};
  const opts = it => Object.fromEntries(it.opts.filter(o => o[0]).map(o => [o[0], o[1]]));
  const lv = levels => Object.fromEntries(levels.filter(l => l[0]).map(l => [l[0], l[1]]));
  function walk(it, card){
    if (it.type === 'row') return it.items.forEach(x => walk(x, card));
    const L = t => card + (t ? ' - ' + t : '');
    if (it.id === 'tools'){
      const o = opts(it); if (mode === 'prev') Object.keys(o).forEach(k => { if (!PREV_TOOLS.includes(k)) delete o[k]; });
      sc.tools = {type: 'multi', label: L(it.label), options: o}; return;
    }
    if (it.type === 'select') sc[it.id] = {type: 'select', label: L(it.label), options: opts(it)};
    else if (it.type === 'chips') sc[it.id] = {type: 'multi', label: L(it.label), options: opts(it)};
    else if (it.type === 'number') sc[it.id] = {type: 'number', label: L(it.label)};
    else if (it.type === 'text' || it.type === 'textarea') sc[it.id] = {type: 'text', label: L(it.label)};
    else if (it.type === 'sensory') SENS_MOD.forEach(m => {
      sc['ps_' + m[0]] = {type: 'select', label: L('דיווח חושי - ' + m[1]), options: {none: 'ללא רגישות', sens: 'רגישות', seek: 'חיפוש תחושה'}};
      sc['psn_' + m[0]] = {type: 'text', label: L('פירוט חושי - ' + m[1])};
    });
    else if (it.type === 'scores') it.rows.forEach(r => {
      sc[it.id + '_' + r[0] + '_p'] = {type: 'number', label: L(it.label.replace(/\s*\(.*\)$/, '') + ' - ' + r[1] + ' - אחוזון'), min: 0, max: 100};
      if (!it.noStd) sc[it.id + '_' + r[0] + '_s'] = {type: 'number', label: L(it.label.replace(/\s*\(.*\)$/, '') + ' - ' + r[1] + ' - ציון תקן'), min: 20, max: 180};
    });
    else if (it.type === 'ayres') AYRES_ITEMS.forEach(r => { sc['ay_' + r[0]] = {type: 'select', label: L('איירס - ' + r[1]), options: lv(AYRES_LEVELS)}; });
    else if (it.type === 'sp2') SP2_QUADS.concat(SP2_SECTIONS, SP2_BEH).forEach(r => {
      const pre = SP2_QUADS.includes(r) ? 'sq_' : SP2_SECTIONS.includes(r) ? 'ss_' : 'sb_';
      sc[pre + r[0]] = {type: 'select', label: L('פרופיל חושי - ' + r[1]), options: lv(SP2_LEVELS)};
    });
  }
  const secs = mode === 'notes' ? ['s_bg', 's_rep', 's_find'] : ['s_bg', 's_rep'];
  SECTIONS.filter(x => secs.includes(x.id)).forEach(x => x.cards.forEach(c => c.items.forEach(it => walk(it, c.title))));
  sc.impact = {type: 'text', label: 'השפעה של הקשיים על התפקוד וההשתתפות בבית ובמסגרת'};
  return sc;
}
// מבנה התשובה: רשימת פריטים, כל אחד עם שדה, ערך וציטוט מהטקסט (structured outputs)
const EXTRACT_FORMAT = {type: 'json_schema', schema: {type: 'object', additionalProperties: false, required: ['items'], properties: {
  items: {type: 'array', items: {type: 'object', additionalProperties: false, required: ['field', 'value', 'quote'],
    properties: {field: {type: 'string'}, value: {type: 'string'}, quote: {type: 'string'}}}}}}};
const EXTRACT_GUIDE = `אתה עוזר למרפאה בעיסוק במכון להתפתחות הילד בישראל. קיבלת טקסט ורשימת שדות של טופס דוח אבחון.
המשימה: לחלץ מהטקסט את המידע שמתאים לשדות. לכל ערך מצרפים ציטוט מדויק מהטקסט שעליו הוא מבוסס, כדי שהמאבחנת תוכל לאשר אותו.

כללי ברזל:
1. רק מידע שכתוב במפורש בטקסט. אסור להסיק, לנחש או להשלים. אם אין מידע לשדה, אל תכלול אותו.
2. כל פריט: field = מזהה השדה, value = הערך, quote = קטע שמועתק מילה במילה מהטקסט (עד 30 מילים) ומבסס את הערך. בלי ציטוט מדויק, אל תכלול את הפריט.
3. בשדה select: value הוא מפתח אחד מתוך options. בשדה multi: פריט נפרד לכל מפתח מתוך options. בשדה number: ספרות בלבד, בדיוק כמו בטקסט.
4. בשדה text: משפט או כמה משפטים קצרים בעברית, בגוף שלישי ובסגנון קליני. פרטים שאין להם אפשרות מתאימה ב-options נכנסים לשדות ההערות של אותו כרטיס.
5. זהה את החלקים בטקסט לפי התוכן, גם כשהכותרות שונות מהטופס או חסרות.
6. תגיות כמו [שם], [שם2], [שם משפחה], [תאריך], [יישוב], [הוסר] הן פרטים שהוסרו. העתק אותן כמו שהן, ואל תנסה לשחזר אותן.
7. שדה ref הוא הגורם שהפנה לאבחון הנוכחי. reasons הן סיבות ההפניה. impact: איך הקשיים משפיעים על היומיום בבית ובמסגרת.

החזר אך ורק אובייקט JSON תקין במבנה {"items":[{"field":"...","value":"...","quote":"..."}]}, בלי טקסט נוסף.`;
const EXTRACT_MODE_GUIDE = {
  prev: 'סוג הטקסט: מסמכים קודמים (שאלונים, דוחות של אבחונים קודמים, סיכומי שיחה). מלא רקע, דיווחים, טיפולים קודמים (prevTx, כולל המלצות שניתנו) ואמצעי הערכה מהסוג שמופיע ב-options. אין לך שדות ממצאים: ממצאים מאבחון קודם נכנסים בתמצית ל-prevTx.',
  notes: 'סוג הטקסט: הרשמים של המאבחנת מהאבחון הנוכחי (תצפיות, ציונים, דיווחים). מלא גם את הממצאים, הציונים והתצפיות של האבחון הנוכחי, ואת אמצעי ההערכה שבוצעו בו.',
};
// מנרמל לצורך השוואת ציטוט: רווחים, מרכאות וגרשיים
const normQ = t => DEID.normalize(t).replace(/\s+/g, ' ').trim();
// מסנן ומאמת את ההצעות: שדה קיים, ערך חוקי, ציטוט שבאמת מופיע בטקסט שנשלח
function checkItems(raw, sc, sent){
  const textN = normQ(sent), seen = new Set(), out = [];
  (raw || []).forEach(x => {
    if (!x || !sc[x.field]) return;
    const f = sc[x.field], v = String(x.value == null ? '' : x.value).trim(); if (!v) return;
    if ((f.type === 'select' || f.type === 'multi') && !(v in f.options)) return;
    if (f.type === 'number'){ const n = Number(v.replace(',', '.')); if (!isFinite(n) || (f.min != null && (n < f.min || n > f.max))) return; }
    const key = x.field + '=' + v; if (seen.has(key)) return; seen.add(key);
    const quote = String(x.quote || '').trim(), qok = quote.length >= 2 && textN.includes(normQ(quote));
    const el = $(x.field), chip = f.type === 'multi' && chipInput(x.field, v);
    if (chip && chip.checked) return;   // כבר מסומן
    const filled = !chip && el && (el.tagName === 'SELECT' || el.tagName === 'INPUT') && el.value.trim() !== '';
    out.push({field: x.field, value: v, quote, qok, filled, label: f.label, shown: f.options ? f.options[v] : v});
  });
  return out;
}

async function extractWithClaude(){
  const text = importOutgoing();
  if (!text){ flash('קודם קראי קובץ'); return; }
  // בדיקת ביטחון: שמות שהוזנו לא אמורים להופיע במה שנשלח
  const leak = nameList().find(x => new RegExp('(?<![\\u05D0-\\u05EA])' + escRe(x.name) + '(?![\\u05D0-\\u05EA])').test(text));
  if (leak){ $('imStatus').innerHTML = '<div class="warnbox">השליפה בוטלה: נמצא שם בטקסט שעמד להישלח.</div>'; return; }
  const body = text.length > EXTRACT_MAX ? text.slice(0, EXTRACT_MAX) : text;
  const sc = extractSchema();
  const user = 'מגדר: ' + (val('gender') === 'f' ? 'בת' : 'בן') + '.\n' + EXTRACT_MODE_GUIDE[importMode] + '\n\nהשדות האפשריים:\n' + JSON.stringify(sc) + '\n\nהטקסט:\n' + body;
  if (!claudeReady()){ openKeyPanel(extractWithClaude); return; }
  if (!(await confirmSend('שליפה וניתוח בעזרת Claude', user.split('\n').slice(0, 2).join('\n') + '\n\n' + body))) return;
  const btn = $('imExtract'); btn.disabled = true; btn.textContent = 'מנתח...';
  const prog = n => { btn.textContent = 'מנתח... (' + n + ' תווים)'; };
  const model = load(MODEL_STORE) || EXTRACT_MODEL;
  try {
    let reply;
    try { reply = await callClaude(EXTRACT_GUIDE, user, prog, {model, format: EXTRACT_FORMAT, kind: 'extract'}); }
    catch(e){ if (e.status !== 400) throw e; reply = await callClaude(EXTRACT_GUIDE, user, prog, {model, kind: 'extract'}); }   // בלי structured outputs, אם המודל לא תומך
    const obj = parseJsonReply(reply);
    extractItems = checkItems(obj.items, sc, body);
    renderExtractReview(text.length > EXTRACT_MAX);

    $('imStatus').innerHTML = '<div class="warnbox">השליפה נכשלה: ' + esc(err.message) + ' אפשר להשתמש ב"מילוי לפי כותרות".</div>';
  } finally { btn.disabled = false; btn.textContent = 'שליפה וניתוח בעזרת Claude'; }
}

// =====================================================================
//  ייצוא לקובץ Word (docx), נבנה כולו בדפדפן
// =====================================================================
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

  FIELDS.forEach(f => {

    parts.push(wPara(' ', {after:240}));

function dictPunct(t){

function toggleDict(ta, btn){
  const same = dict && dict.ta === ta;
  stopDict(); if (same) return;

  const d = dict = {rec, ta, btn, on: true};
  rec.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) dictInsert(ta, e.results[i][0].transcript); };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){ flash('אין הרשאה למיקרופון'); if (dict === d) stopDict(); }

  };

}

// מעדכן את הצ'יפים האישיים בטופס לפי רשימת ניסוחים (אחרי סנכרון מהענן)
function refreshPhraseChips(mine){
  SECTIONS.forEach(sec => sec.cards.forEach(c => { const walk = it => {
    if (it.type === 'row') return it.items.forEach(walk);
    if (it.type !== 'chips' || NO_CUSTOM.includes(it.id)) return;
    const want = mine[it.id] || [], box = document.querySelector('[data-chips="' + it.id + '"]'); if (!box) return;
    it.opts.filter(o => o[3] && !want.some(w => w[0] === o[0])).forEach(o => { const i = chipInput(it.id, o[0]); if (i) i.closest('label').remove(); delete OPT[it.id][o[0]]; });
    it.opts = it.opts.filter(o => !o[3] || want.some(w => w[0] === o[0]));
    want.filter(w => !it.opts.some(o => o[0] === w[0])).forEach(w => {
      const o = [w[0], w[1], w[2], true]; it.opts.push(o); OPT[it.id][w[0]] = {label: w[1], phrase: w[2]};
      box.querySelector('.addph').insertAdjacentHTML('beforebegin', chipHtml(o));
    });
  }; c.items.forEach(walk); }));
  update();
}
function delPhrase(id, key){
  const mine = loadPhrases();
  const o = (mine[id] || []).find(x => x[0] === key); if (!o) return;
  if (!confirm('למחוק את הניסוח "' + o[1] + '"?')) return;
  mine[id] = mine[id].filter(x => x[0] !== key); if (!mine[id].length) delete mine[id];
  savePhrases(mine); saveDel(loadDel().concat(key)); if (cloudSignedIn()) syncPhrases();
  const it = chipItem(id); if (it) it.opts = it.opts.filter(x => x[0] !== key);
  if (OPT[id]) delete OPT[id][key];
  const inp = document.querySelector('[data-chips="' + id + '"] input[value="' + CSS.escape(key) + '"]'); if (inp) inp.closest('label').remove();
  update(); openMyPhrases();
}
